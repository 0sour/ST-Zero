<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST-Zero · 主界面</title>
<style>
/* ============================================================
   ST-Zero 主界面 · 风格 C 沉浸叙事（真实接入后端）
   ============================================================ */
:root {
  --bg-0: #141210;
  --bg-1: #1c1917;
  --bg-2: #262220;
  --bg-3: #322d2a;
  --border: rgba(214, 178, 128, 0.16);
  --border-strong: rgba(214, 178, 128, 0.32);
  --text-1: #e8e0d4;
  --text-2: #b3a896;
  --text-3: #7d7263;
  --accent: #d6b280;
  --accent-2: #a88a5c;
  --accent-soft: rgba(214, 178, 128, 0.1);
  --accent-strong: rgba(214, 178, 128, 0.22);
  --danger: #e07a5f;
  --danger-soft: rgba(224, 122, 95, 0.12);
  --success: #81b29a;
  --success-soft: rgba(129, 178, 154, 0.12);
  --radius: 8px;
  --radius-sm: 4px;
  --radius-lg: 12px;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --font: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', monospace;
  --bg-1-rgb: 28, 25, 23;
  --bg-2-rgb: 38, 34, 32;
  --bg-3-rgb: 50, 45, 42;
  --panel-alpha: 0.85;
  --ctrl-alpha: 0.75;
  --hl-alpha: 0.65;
  --bg-image-default: #141210;
  --mask-rgb: 20, 16, 12;
  --mask-alpha: 0.55;
  --bg-blur: 0px;
}
[data-theme="light"] {
  --bg-0: #f5f1ea;
  --bg-1: #fdfbf7;
  --bg-2: #efe9df;
  --bg-3: #e4dccd;
  --border: rgba(120, 90, 50, 0.18);
  --border-strong: rgba(120, 90, 50, 0.35);
  --text-1: #2b2419;
  --text-2: #6b5d48;
  --text-3: #a08d72;
  --accent: #a8824a;
  --accent-2: #8a6a3a;
  --accent-soft: rgba(168, 130, 74, 0.1);
  --accent-strong: rgba(168, 130, 74, 0.2);
  --danger: #c05a3e;
  --danger-soft: rgba(192, 90, 62, 0.1);
  --success: #4d8a6a;
  --success-soft: rgba(77, 138, 106, 0.1);
  --shadow: 0 2px 8px rgba(80, 60, 30, 0.1);
  --shadow-lg: 0 8px 32px rgba(80, 60, 30, 0.16);
  --bg-1-rgb: 253, 251, 247;
  --bg-2-rgb: 239, 233, 223;
  --bg-3-rgb: 228, 220, 205;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { font-family: var(--font-ui); background: var(--bg-0); color: var(--text-1); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: var(--accent-strong); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; flex-shrink: 0; }
.ic-fill { fill: currentColor; stroke: none; }

/* 背景 */
.bg-layer { position: fixed; inset: 0; z-index: 0; background-image: var(--bg-image, var(--bg-image-default)); background-size: cover; background-position: center; filter: blur(var(--bg-blur)); }
.bg-mask { position: fixed; inset: 0; z-index: 1; background: rgba(var(--mask-rgb), var(--mask-alpha)); }
.page { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; }

/* 顶栏 */
.topbar { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.logo-badge { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.topbar-search { flex: 1; max-width: 320px; position: relative; }
.topbar-search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; }
.topbar-search input { width: 100%; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px 7px 32px; color: var(--text-1); font-size: 13px; outline: none; font-family: var(--font-ui); transition: all var(--transition); }
.topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.topbar-actions { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.tb-btn { width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-3); border: 1px solid transparent; background: transparent; font-size: 15px; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 34px; }
.tb-btn:hover { background: var(--accent-soft); color: var(--accent); }
.tb-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--border); }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: var(--font); cursor: pointer; }

/* 主体 */
.body { flex: 1; display: flex; min-height: 0; }
.sidebar { width: 250px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.sidebar-header { padding: 10px 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); color: var(--text-2); font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-ui); transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 32px; }
.sb-btn .ic { font-size: 13px; }
.sb-btn:hover { border-color: var(--accent); color: var(--accent); }
.sb-btn.primary { background: var(--accent); border: none; color: var(--bg-0); font-weight: 600; }
.sb-btn.primary:hover { background: var(--accent-2); color: var(--bg-0); }
.sidebar-tools { padding: 8px 12px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
.sidebar-tools input { flex: 1; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; color: var(--text-1); font-size: 12.5px; outline: none; }
.sidebar-tools input:focus { border-color: var(--accent); }
.sort-menu { position: relative; flex-shrink: 0; }
.sort-trigger { width: 26px; height: 26px; font-size: 13px; }
.sort-pop { position: absolute; top: calc(100% + 4px); right: 0; min-width: 110px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 4px; z-index: 60; opacity: 0; transform: translateY(-4px); pointer-events: none; transition: all 0.15s ease; }
.sort-menu.open .sort-pop { opacity: 1; transform: translateY(0); pointer-events: auto; }
/* 自研下拉选择（组件库规范） */
.select { position: relative; }
.select-trigger {
  display: flex; align-items: center; gap: 6px;
  width: 100%; height: 34px;
  padding: 0 12px;
  font-family: var(--font-ui); font-size: 13px;
  color: var(--text-1);
  background: rgba(var(--bg-2-rgb), var(--ctrl-alpha));
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: none;
  transition: all var(--transition);
  appearance: none; -webkit-appearance: none;
  line-height: 34px;
}
.select-trigger:hover { border-color: var(--border-strong); }
.select.open .select-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select-trigger .sel-value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.select-trigger .sel-arrow { color: var(--text-3); font-size: 12px; transition: transform var(--transition); flex-shrink: 0; display: flex; }
.select.open .sel-arrow { transform: rotate(180deg); color: var(--accent); }
.select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  z-index: 60;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 4px;
  max-height: 200px; overflow-y: auto;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: all 0.15s ease;
}
.select.open .select-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }
/* 下拉选项（组件库规范） */
.select-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.select-option:hover { background: var(--bg-2); color: var(--text-1); }
.select-option.selected { background: var(--accent-soft); color: var(--accent); }
.select-option .sel-check { margin-left: auto; color: var(--accent); font-size: 13px; display: none; }
.select-option.selected .sel-check { display: flex; }
.char-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.char-item { display: flex; gap: 10px; padding: 10px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all var(--transition); }
.char-item:hover { background: rgba(var(--bg-2-rgb), var(--hl-alpha)); }
.char-item.active { background: var(--accent-soft); border-color: var(--border); }
.char-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border: 1px solid var(--border); overflow: hidden; }
.char-avatar img { width: 100%; height: 100%; object-fit: cover; }
.char-info { flex: 1; min-width: 0; }
.char-name { font-size: 13.5px; font-weight: 600; font-family: var(--font); display: flex; align-items: center; gap: 6px; }
.char-name .fav { color: var(--accent); font-size: 12px; display: flex; }
.char-desc { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.char-meta { font-size: 10px; color: var(--text-3); margin-top: 3px; display: flex; gap: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; font-size: 11px; color: var(--text-2); background: rgba(var(--bg-3-rgb), var(--hl-alpha)); border: 1px solid var(--border); border-radius: 3px; white-space: nowrap; }
.tag-accent { color: var(--accent); background: var(--accent-soft); }

/* 聊天区 */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: transparent; }
.chat-header { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--border); background: rgba(var(--bg-1-rgb), var(--panel-alpha)); flex-shrink: 0; }
.chat-header .ch-name { font-weight: 600; font-size: 14.5px; font-family: var(--font); }
.chat-header .ch-sub { font-size: 11.5px; color: var(--text-3); }
.chat-header .spacer { flex: 1; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 10px; max-width: 80%; animation: msg-in .25s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 1px solid var(--border); overflow: hidden; }
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-body { min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.msg-meta .m-name { color: var(--accent); font-weight: 600; font-family: var(--font); font-size: 12px; }
.msg-bubble { background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 2px 8px 8px 2px; padding: 10px 14px; font-size: 13.5px; line-height: 1.7; font-family: var(--font); white-space: pre-wrap; word-break: break-word; }
.msg.user .msg-bubble { background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border-left: 3px solid var(--text-3); border-radius: 8px 2px 2px 8px; }
.msg-actions { display: none; gap: 4px; margin-top: 4px; }
.msg:hover .msg-actions { display: flex; }
.msg-act { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-1); color: var(--text-3); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 24px; }
.msg-act:hover { color: var(--accent); border-color: var(--accent); }
.swipe-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.swipe-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-1); color: var(--accent); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 26px; }
.swipe-btn:hover { border-color: var(--accent); }
.swipe-count { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
@keyframes msg-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* 输入栏 */
.chat-input { border-top: 1px solid var(--border); padding: 10px 16px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); flex-shrink: 0; }
.input-tools { display: flex; gap: 4px; margin-bottom: 6px; }
.it-btn { width: 28px; height: 28px; border-radius: 4px; border: none; background: transparent; color: var(--text-3); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 28px; }
.it-btn:hover { background: var(--bg-2); color: var(--accent); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-row textarea { flex: 1; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-1); font-size: 14px; resize: none; outline: none; min-height: 42px; max-height: 120px; font-family: var(--font); transition: all var(--transition); }
.input-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.send-btn { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg-0); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 42px; }
.send-btn:hover { background: var(--accent-2); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }

/* 右侧栏 */
.right-panel { width: 320px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.rp-tabs { display: flex; border-bottom: 1px solid var(--border); }
.rp-tab { flex: 1; height: 40px; border: none; background: transparent; color: var(--text-3); font-size: 12.5px; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font); transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 40px; text-align: center; }
.rp-tab:hover { color: var(--text-1); }
.rp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.rp-body { flex: 1; overflow-y: auto; padding: 14px; }
.rp-panel { display: none; }
.rp-panel.active { display: block; }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.field input:not([type="checkbox"]):not([type="radio"]), .field textarea, .field select { width: 100%; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-1); font-size: 13px; outline: none; font-family: var(--font-ui); transition: all var(--transition); }
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); padding: 4px 0; cursor: pointer; }
.check-row input { accent-color: var(--accent); width: auto; flex-shrink: 0; }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-row input[type=number] { width: 60px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; color: var(--text-1); font-size: 12px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--accent); font-family: var(--font); letter-spacing: 1px; margin: 18px 0 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 16px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; color: var(--text-1); background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); white-space: nowrap; appearance: none; -webkit-appearance: none; line-height: 32px; }
.btn .ic { font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-0); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); color: var(--bg-0); }
.btn.danger { color: var(--danger); border-color: rgba(224, 122, 95, 0.35); }

.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--bg-0); font-weight: 600; }
.btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); color: var(--bg-0); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-lg { height: 40px; padding: 0 22px; font-size: 14px; }
.btn-block { width: 100%; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; font-size: 10px; font-weight: 600; border-radius: 9px; background: var(--accent); color: var(--bg-0); }
.badge-danger { background: var(--danger); color: #fff; }
.badge-success { background: var(--success); color: var(--bg-0); }
.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 6px; background: var(--bg-2); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: var(--radius-sm); font-family: var(--mono); font-size: 11px; color: var(--text-2); }
.btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.icon-btn { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 15px; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 32px; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

/* 世界书 / 正则列表 */
.wi-list { display: flex; flex-direction: column; gap: 6px; }
.wi-item { padding: 9px 11px; border-radius: 6px; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition); }
.wi-item:hover { border-color: var(--accent); }
.wi-item .wi-k { font-size: 12px; color: var(--accent); font-family: var(--mono); }
.wi-item .wi-c { font-size: 11px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rx-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 6px; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); margin-bottom: 6px; }
.rx-item .rx-name { flex: 1; font-size: 12.5px; font-family: var(--font); }
.rx-on { width: 36px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; cursor: pointer; transition: all var(--transition); }
.rx-on::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-0); transition: all var(--transition); }
.rx-off { width: 36px; height: 20px; border-radius: 10px; background: var(--bg-3); position: relative; cursor: pointer; }
.rx-off::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-3); }

/* 背景控制 */
.bg-presets { display: flex; gap: 6px; }
.bg-preset { width: 40px; height: 28px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; background-size: cover; background-position: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 28px; }
.bg-preset:hover { border-color: var(--accent); }
.bg-preset[data-bg="0"] { background: var(--bg-2); }
.bg-preset[data-bg="1"] { background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); }
.bg-preset[data-bg="2"] { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); }
.bg-preset[data-bg="3"] { background: radial-gradient(ellipse at 20% 20%,#2d1b69,#1a1a2e 60%,#0f0f1a); }
.theme-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.theme-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 26px; }
.theme-swatch:hover { border-color: var(--accent); }
.theme-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

/* 弹窗 / Toast / 用户菜单 */
.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal { width: 420px; max-width: calc(100vw - 32px); max-height: calc(100vh - 64px); background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateY(12px) scale(0.98); transition: transform 0.2s ease; }
.modal-overlay.show .modal { transform: translateY(0) scale(1); }
.modal-header { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; font-family: var(--font); }
.modal-header .spacer { flex: 1; }
.modal-body { padding: 20px; overflow-y: auto; font-size: 13.5px; color: var(--text-2); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 360px; padding: 12px 16px; background: var(--bg-1); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 13px; animation: toast-in 0.25s ease; }
.toast .ic { font-size: 15px; }
.toast-success { border-left-color: var(--success); }
.toast-success .ic { color: var(--success); }
.toast-danger { border-left-color: var(--danger); }
.toast-danger .ic { color: var(--danger); }
@keyframes toast-in { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.theme-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 500; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); font-size: 12px; cursor: pointer; color: var(--text-2); transition: all var(--transition); appearance: none; -webkit-appearance: none; line-height: 20px; }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

/* 用户菜单 */
.user-menu { position: fixed; top: 50px; right: 12px; z-index: 150; min-width: 180px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 4px; display: none; }
.user-menu.show { display: block; animation: scale-in .15s ease; }
@keyframes scale-in { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.um-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-2); cursor: pointer; transition: all var(--transition); }
.um-item:hover { background: var(--bg-2); color: var(--text-1); }
.um-item .ic { font-size: 14px; }
.um-item.danger { color: var(--danger); }
.um-item.danger:hover { background: var(--danger-soft); }
.um-divider { height: 1px; background: var(--border); margin: 4px 0; }
.um-user { padding: 10px 12px; font-size: 12px; color: var(--text-3); border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.um-user strong { display: block; color: var(--text-1); font-size: 13px; font-family: var(--font); }

/* 登录页 */
.login-page { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: var(--bg-0); }
.login-card { width: 380px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 32px; }
.login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 700; font-family: var(--font); margin-bottom: 6px; }
.login-logo .logo-badge { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; }
.login-sub { text-align: center; font-size: 12px; color: var(--text-3); margin-bottom: 24px; }
.login-error { background: var(--danger-soft); border: 1px solid rgba(224, 122, 95, 0.3); color: var(--danger); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; margin-bottom: 14px; display: none; }
.login-error.show { display: block; }

/* 空状态 */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 40px 20px; text-align: center; }
.empty-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); border: 1px solid var(--border); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 4px; }
.empty-title { font-size: 14px; font-weight: 600; font-family: var(--font); }
.empty-desc { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
</style>
</head>

<!-- 背景层 -->
<div class="bg-layer"></div>
<div class="bg-mask"></div>

<!-- 登录页 -->
<div class="login-page" id="login-page">
  <div class="login-card">
    <div class="login-logo"><div class="logo-badge">S0</div>ST-Zero</div>
    <div class="login-sub">欢迎回来，请登录你的账户</div>
    <div class="login-error" id="login-error"></div>
    <div class="field">
      <label class="field-label">用户名</label>
      <input id="login-username" placeholder="输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label class="field-label">密码</label>
      <input id="login-password" type="password" placeholder="输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block btn-lg" id="login-btn" style="width:100%;height:40px;font-size:14px">登 录</button>
  </div>
</div>

<div class="page" id="main-page" style="display:none">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo"><div class="logo-badge">S0</div>ST-Zero</div>
    <div class="topbar-search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="global-search" placeholder="搜索角色、世界书、正则…">
    </div>
    <div class="topbar-actions">
      <div class="tb-btn" title="设置" data-tab-btn="settings"><svg class="ic"><use href="#i-settings"/></svg></div>
      <div class="avatar" id="user-avatar" title="用户菜单">S</div>
    </div>
  </div>

  <div class="body">
    <!-- 左侧栏 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button class="sb-btn primary" id="btn-new-char"><svg class="ic"><use href="#i-plus"/></svg> 新建</button>
        <button class="sb-btn" id="btn-import-char"><svg class="ic"><use href="#i-upload"/></svg> 导入</button>
        <button class="sb-btn" id="btn-groups" title="群聊"><svg class="ic"><use href="#i-users"/></svg></button>
        <input type="file" id="import-file" accept=".png,.json,.yaml,.yml,.charx" hidden>
      </div>
      <div class="sidebar-tools">
        <input id="char-search" placeholder="搜索角色…">
        <div class="sort-menu" data-sort-menu>
          <button class="icon-btn sort-trigger" title="排序方式"><svg class="ic"><use href="#i-sliders"/></svg></button>
          <div class="sort-pop" role="listbox">
            <div class="select-option selected" data-value="最近" role="option">最近<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
            <div class="select-option" data-value="A-Z" role="option">A-Z<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
            <div class="select-option" data-value="收藏" role="option">收藏<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
          </div>
        </div>
      </div>
      <div class="group-list" id="group-list" style="display:none;padding:8px;border-bottom:1px solid var(--border)"></div>
      <div class="char-list" id="char-list"></div>
    </div>

    <!-- 聊天区 -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="ch-name" id="chat-char-name">选择角色开始聊天</div>
        <div class="ch-sub" id="chat-title"></div>
        <div class="spacer"></div>
        <div class="tb-btn" title="聊天管理" id="btn-chat-manage"><svg class="ic"><use href="#i-folder"/></svg></div>
        <div class="tb-btn" title="聊天设置" id="btn-chat-settings"><svg class="ic"><use href="#i-more"/></svg></div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="empty" id="chat-empty">
          <div class="empty-icon"><svg class="ic"><use href="#i-message"/></svg></div>
          <div class="empty-title">开始一段新的对话</div>
          <div class="empty-desc">选择一个角色，或新建角色开始聊天</div>
        </div>
      </div>
      <div class="chat-input">
        <div class="input-tools">
          <button class="it-btn" title="附件"><svg class="ic"><use href="#i-paperclip"/></svg></button>
          <button class="it-btn" title="图片"><svg class="ic"><use href="#i-image"/></svg></button>
          <button class="it-btn" title="语音"><svg class="ic"><use href="#i-mic"/></svg></button>
        </div>
        <div class="input-row">
          <textarea id="chat-input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send-btn" id="send-btn" title="发送"><svg class="ic"><use href="#i-send"/></svg></button>
        </div>
      </div>
    </div>

    <!-- 右侧栏 -->
    <div class="right-panel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="char">角色</div>
        <div class="rp-tab" data-tab="world">世界书</div>
        <div class="rp-tab" data-tab="regex">正则</div>
        <div class="rp-tab" data-tab="preset">预设</div>
      </div>
      <div class="rp-body">
        <!-- 角色编辑 -->
        <div class="rp-panel active" id="panel-char">
          <div class="field">
            <label class="field-label">名称</label>
            <input id="edit-name">
          </div>
          <div class="field">
            <label class="field-label">描述</label>
            <textarea id="edit-desc"></textarea>
          </div>
          <div class="field">
            <label class="field-label">人格</label>
            <textarea id="edit-personality"></textarea>
          </div>
          <div class="field">
            <label class="field-label">场景</label>
            <textarea id="edit-scenario"></textarea>
          </div>
          <div class="field">
            <label class="field-label">首条消息</label>
            <textarea id="edit-first"></textarea>
          </div>
          <div class="field">
            <label class="field-label">示例对话</label>
            <textarea id="edit-example" placeholder="&lt;START&gt;\n{{user}}: ...\n{{char}}: ..."></textarea>
          </div>
          <div class="field">
            <label class="field-label">备选问候语</label>
            <div id="greetings-list"></div>
            <button class="btn btn-sm" id="btn-add-greeting" style="margin-top:6px"><svg class="ic"><use href="#i-plus"/></svg> 添加问候语</button>
          </div>
          <div class="field">
            <label class="field-label">标签</label>
            <div id="edit-tags" style="display:flex;gap:6px;flex-wrap:wrap"></div>

<script src="/js/api.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function $on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  /* ============ 状态 ============ */
  var state = {
    characters: [],
    currentChar: null,
    currentChat: null,
    messages: [],
    worlds: [],
    currentWorld: null,
    regexScripts: [],
    user: null,
    isGenerating: false,
  };

  /* ============ 工具 ============ */
  function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function now() { var d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function toast(type, icon, msg) {
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.innerHTML = '<svg class="ic"><use href="#' + icon + '"/></svg><span>' + esc(msg) + '</span>';
    $('#toast-wrap').appendChild(t);
    setTimeout(function () { t.style.transition = 'all .3s ease'; t.style.opacity = '0'; t.style.transform = 'translateX(24px)'; setTimeout(function () { t.remove(); }, 300); }, 2500);
  }
  function openModal(title, bodyHtml, footerHtml) {
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = bodyHtml;
    $('#modal-footer').innerHTML = footerHtml || '';
    $('#modal-overlay').classList.add('show');
  }
  function closeModal() { $('#modal-overlay').classList.remove('show'); }
  function avatarImg(path, initial, color) {
    if (path) return '<img src="/files/' + esc(path) + '" onerror="this.style.display=\'none\'">';
    return esc(initial || '?');
  }

  /* ============ 登录 ============ */
  function showLogin() {
    $('#login-page').style.display = 'flex';
    $('#main-page').style.display = 'none';
  }
  function showMain() {
    $('#login-page').style.display = 'none';
    $('#main-page').style.display = 'flex';
  }
  function doLogin() {
    var u = $('#login-username').value.trim();
    var p = $('#login-password').value;
    if (!u || !p) { showLoginError('请输入用户名和密码'); return; }
    api.login(u, p).then(function (data) {
      setToken(data.token);
      state.user = data.user;
      $('#login-error').classList.remove('show');
      $('#login-password').value = '';
      initApp();
    }).catch(function (e) { showLoginError(e.message); });
  }
  function showLoginError(msg) {
    var el = $('#login-error');
    el.textContent = msg;
    el.classList.add('show');
  }
  $('#login-btn').addEventListener('click', doLogin);
  $('#login-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  $('#login-username').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#login-password').focus(); });

  /* ============ 初始化 ============ */
  function initApp() {
    showMain();
    $('#um-user-info').innerHTML = '<strong>' + esc(state.user.display_name || state.user.username) + '</strong>' + esc(state.user.username) + (state.user.role === 'admin' ? ' · 管理员' : '');
    $('#um-admin').style.display = state.user.role === 'admin' ? 'flex' : 'none';
    $('#user-avatar').textContent = (state.user.display_name || state.user.username)[0].toUpperCase();
    loadCharacters();
    loadWorlds();
    loadSettings();
    loadRegex();
    loadPresets();
    loadGroups();
  }

  /* ============ 角色卡 ============ */
  function loadCharacters() {
    api.listCharacters().then(function (data) {
      state.characters = data.characters;
      renderChars();
      if (state.characters.length && !state.currentChar) {
        selectChar(state.characters[0].id);
      }
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  }
  function renderChars() {
    var q = $('#char-search').value.trim().toLowerCase();
    var sort = document.querySelector('.sort-pop .select-option.selected').getAttribute('data-value');
    var list = state.characters.filter(function (c) { return !q || c.name.toLowerCase().includes(q); });
    if (sort === 'A-Z') list.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    if (sort === '收藏') list.sort(function (a, b) { return (b.fav ? 1 : 0) - (a.fav ? 1 : 0); });
    if (!list.length) {
      $('#char-list').innerHTML = '<div class="empty"><div class="empty-icon"><svg class="ic"><use href="#i-users"/></svg></div><div class="empty-title">暂无角色</div><div class="empty-desc">点击"新建"创建第一个角色</div></div>';
      return;
    }
    $('#char-list').innerHTML = list.map(function (c) {
      return '<div class="char-item' + (state.currentChar && c.id === state.currentChar.id ? ' active' : '') + '" data-id="' + c.id + '">' +
        '<div class="char-avatar">' + avatarImg(c.avatar_path, c.name[0]) + '</div>' +
        '<div class="char-info">' +
          '<div class="char-name">' + esc(c.name) + '</div>' +
          '<div class="char-desc">' + esc(c.name) + '</div>' +
        '</div>' +
        '<button class="icon-btn fav-btn" data-fav="' + c.id + '" title="' + (c.fav ? '取消收藏' : '收藏') + '" style="color:' + (c.fav ? 'var(--accent)' : 'var(--text-3)') + '"><svg class="ic' + (c.fav ? ' ic-fill' : '') + '"><use href="#i-star"/></svg></button>' +
      '</div>';
    }).join('');
    $$('#char-list .char-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.closest('.fav-btn')) return;
        selectChar(el.getAttribute('data-id'));
      });
    });
    $$('#char-list .fav-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-fav');
        var c = state.characters.find(function (x) { return x.id === id; });
        if (!c) return;
        api.toggleFav(id, !c.fav).then(function (d) {
          c.fav = d.fav;
          renderChars();
          toast('success', 'i-check', d.fav ? '已收藏' : '已取消收藏');
        }).catch(function (err) { toast('danger', 'i-alert', err.message); });
      });
    });
  }
  function selectChar(id) {
    state.currentChar = state.characters.find(function (c) { return c.id === id; });
    state.currentChat = null;
    state.messages = [];
    $('#chat-char-name').textContent = state.currentChar.name;
    $('#chat-title').textContent = '';
    renderChars();
    renderMessages();
    // 加载角色详情到编辑面板
    api.getCharacter(id).then(function (data) {
      var card = data.card;
      if (card && card.data) {
        $('#edit-name').value = card.data.name || '';
        $('#edit-desc').value = card.data.description || '';
        $('#edit-personality').value = card.data.personality || '';
        $('#edit-scenario').value = card.data.scenario || '';
        $('#edit-first').value = card.data.first_mes || '';
        $('#edit-example').value = card.data.mes_example || '';
        greetings = (card.data.alternate_greetings || []).slice();
        editTags = (card.data.tags || []).slice();
        renderGreetings();
        renderEditTags();
      }
    }).catch(function () {});
    // 加载该角色的聊天列表
    loadChats(id);
  }

  /* ============ 聊天 ============ */
  function loadChats(characterId) {
    api.listChats(characterId).then(function (data) {
      state.chats = data.chats;
      if (state.chats.length) {
        loadChat(state.chats[0].id);
      } else {
        // 自动创建新聊天
        api.createChat(characterId, '新聊天').then(function (d) {
          state.currentChat = { id: d.id, title: '新聊天' };
          $('#chat-title').textContent = '· ' + d.id.slice(0, 8);
          renderMessages();
        });
      }
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  }
  function loadChat(chatId) {
    api.getChat(chatId).then(function (data) {
      state.currentChat = { id: chatId, title: data.chat.title };
      state.messages = data.messages;
      $('#chat-title').textContent = '· ' + (data.chat.title || '');
      renderMessages();
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  }
  function renderMessages() {
    var box = $('#chat-messages');
    if (!state.messages.length) {
      box.innerHTML = '<div class="empty" id="chat-empty"><div class="empty-icon"><svg class="ic"><use href="#i-message"/></svg></div><div class="empty-title">开始一段新的对话</div><div class="empty-desc">发送第一条消息开始</div></div>';
      return;
    }
    box.innerHTML = state.messages.map(function (m, i) {
      var isUser = !!m.is_user;
      var name = m.name || (isUser ? '你' : state.currentChar.name);
      var initial = isUser ? 'S' : (state.currentChar ? state.currentChar.name[0] : '?');
      var avatarPath = isUser ? null : (state.currentChar ? state.currentChar.avatar_path : null);
      var html = '<div class="msg' + (isUser ? ' user' : '') + '" data-idx="' + i + '">' +
        '<div class="msg-avatar">' + avatarImg(avatarPath, initial) + '</div>' +
        '<div class="msg-body">' +
          '<div class="msg-meta"><span class="m-name">' + esc(name) + '</span><span>' + (m.send_date ? new Date(m.send_date).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : now()) + '</span></div>' +
          '<div class="msg-bubble">' + esc(m.mes) + '</div>';
      if (!isUser && m.swipes && m.swipes.length > 1) {
        html += '<div class="swipe-row">' +
          '<button class="swipe-btn" data-swipe="-1" title="上一个"><svg class="ic"><use href="#i-chevron-left"/></svg></button>' +
          '<span class="swipe-count">' + ((m.swipe_id ?? 0) + 1) + '/' + m.swipes.length + '</span>' +
          '<button class="swipe-btn" data-swipe="1" title="下一个"><svg class="ic"><use href="#i-chevron-right"/></svg></button>' +
        '</div>';
      }
      html += '<div class="msg-actions">' +
        '<button class="msg-act" data-act="edit" title="编辑"><svg class="ic"><use href="#i-pencil"/></svg></button>' +
        '<button class="msg-act" data-act="copy" title="复制"><svg class="ic"><use href="#i-copy"/></svg></button>' +
        '<button class="msg-act" data-act="del" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
        (i === state.messages.length - 1 && !isUser ? '<button class="msg-act" data-act="regen" title="重新生成"><svg class="ic"><use href="#i-refresh"/></svg></button>' : '') +
      '</div></div></div>';
      return html;
    }).join('');
    box.scrollTop = box.scrollHeight;
    bindMsgActions();
  }
  function bindMsgActions() {
    $$('#chat-messages .msg-act').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = parseInt(b.closest('.msg').getAttribute('data-idx'));
        var act = b.getAttribute('data-act');
        var m = state.messages[idx];
        if (act === 'copy') {
          navigator.clipboard && navigator.clipboard.writeText(m.mes || '');
          toast('success', 'i-check', '已复制');
        }
        if (act === 'del') {
          api.deleteMessage(state.currentChat.id, idx).then(function () {
            state.messages.splice(idx, 1);
            renderMessages();
          }).catch(function (e) { toast('danger', 'i-alert', e.message); });
        }
        if (act === 'edit') {
          var newText = prompt('编辑消息：', m.mes || '');
          if (newText !== null) {
            api.editMessage(state.currentChat.id, idx, newText).then(function () {
              m.mes = newText;
              renderMessages();
              toast('success', 'i-check', '消息已更新');
            }).catch(function (e) { toast('danger', 'i-alert', e.message); });
          }
        }
        if (act === 'regen') {
          // 删除最后一条 AI 消息并重新生成
          api.deleteMessage(state.currentChat.id, idx).then(function () {
            state.messages.splice(idx, 1);
            renderMessages();
            // 用上一条用户消息重新生成
            var lastUser = null;
            for (var i = state.messages.length - 1; i >= 0; i--) {
              if (state.messages[i].is_user) { lastUser = state.messages[i]; break; }
            }
            if (lastUser) {
              $('#chat-input').value = lastUser.mes || '';
              send();
            }
          }).catch(function (e) { toast('danger', 'i-alert', e.message); });
        }
      });
    });
  }

  /* ============ 发送（SSE 流式） ============ */
  function send() {
    var input = $('#chat-input');
    var text = input.value.trim();
    if (!text || state.isGenerating || !state.currentChat) return;
    input.value = '';
    // 本地追加用户消息
    state.messages.push({ name: state.user.display_name || state.user.username, is_user: true, mes: text, send_date: Date.now() });
    renderMessages();
    state.isGenerating = true;
    $('#send-btn').disabled = true;
    // 打字指示
    var typing = document.createElement('div');
    typing.className = 'msg';
    typing.id = 'typing-msg';
    typing.innerHTML = '<div class="msg-avatar">' + avatarImg(state.currentChar.avatar_path, state.currentChar.name[0]) + '</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>';
    $('#chat-messages').appendChild(typing);
    $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight;
    // SSE 请求
    fetch('/api/chats/' + state.currentChat.id + '/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: JSON.stringify({ content: text }),
    }).then(function (res) {
      if (!res.ok) throw new Error('请求失败 ' + res.status);
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var full = '';
      var aiMsg = null;
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            typing.remove();
            if (aiMsg) {
              state.messages.push(aiMsg);
              renderMessages();
            }
            state.isGenerating = false;
            $('#send-btn').disabled = false;
            return;
          }
          var text2 = decoder.decode(r.value, { stream: true });
          text2.split('\n\n').forEach(function (block) {
            if (!block.startsWith('data:')) return;
            var data = block.slice(5).trim();
            if (!data) return;
            try {
              var json = JSON.parse(data);
              if (json.delta) {
                full += json.delta;
                var t = typing.querySelector('.typing');
                if (t) t.remove();
                var bubble = typing.querySelector('.msg-bubble');
                if (!bubble) {
                  typing.innerHTML = '<div class="msg-avatar">' + avatarImg(state.currentChar.avatar_path, state.currentChar.name[0]) + '</div><div class="msg-body"><div class="msg-meta"><span class="m-name">' + esc(state.currentChar.name) + '</span></div><div class="msg-bubble"></div></div>';
                  bubble = typing.querySelector('.msg-bubble');
                }
                bubble.textContent = full;
                $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight;
              }
              if (json.done) aiMsg = json.message;
              if (json.error) throw new Error(json.error);
            } catch (e) { /* 跳过 */ }
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      typing.remove();
      state.isGenerating = false;
      $('#send-btn').disabled = false;
      toast('danger', 'i-alert', e.message);
    });
  }
  $('#send-btn').addEventListener('click', send);
  $('#chat-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

      opt.classList.add('selected');
      value.textContent = opt.getAttribute('data-value');

    }

        select(opt);
      });

  }
  function applyBlur(v) { body.style.setProperty('--bg-blur', v + 'px'); }
  function applyOpacity(v) { body.style.setProperty('--mask-alpha', (v / 100).toFixed(2)); }
  function applyPanelOpacity(v) {
    var p = v / 100;
    body.style.setProperty('--panel-alpha', p.toFixed(2));
    body.style.setProperty('--ctrl-alpha', (p * 0.88).toFixed(2));
    body.style.setProperty('--hl-alpha', (p * 0.76).toFixed(2));
  }
  $$('.bg-preset').forEach(function (b, i) { b.addEventListener('click', function () { applyBg(presets[i]); }); });
  var file = $('#bg-file');
  $('#bg-upload').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { applyBg('url(' + r.result + ')'); };
    r.readAsDataURL(f);
  });
  $('#bg-clear').addEventListener('click', function () { applyBg(''); });
  $$('.theme-swatch').forEach(function (s, i) { s.addEventListener('click', function () { applyTheme(i); }); });
  function linkSlider(rangeId, numId, fn) {
    var r = $(rangeId), n = $(numId);
    r.addEventListener('input', function () { n.value = r.value; fn(r.value); });
    n.addEventListener('input', function () { r.value = n.value; fn(n.value); });
  }
  linkSlider('#mask-blur', '#mask-blur-num', applyBlur);
  linkSlider('#mask-opacity', '#mask-opacity-num', applyOpacity);
  linkSlider('#panel-opacity', '#panel-opacity-num', applyPanelOpacity);

  /* ============ 主题切换 ============ */
  $('#theme-toggle').addEventListener('click', function () {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) { document.documentElement.removeAttribute('data-theme'); $('#theme-label').textContent = '暗色主题'; }
    else { document.documentElement.setAttribute('data-theme', 'light'); $('#theme-label').textContent = '亮色主题'; }
  });

  /* ============ 弹窗 ============ */
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-overlay').addEventListener('click', function (e) { if (e.target === $('#modal-overlay')) closeModal(); });
  window.closeModal = closeModal;

  /* ============ 角色字段扩展 ============ */
  var greetings = [];
  var editTags = [];
  function renderGreetings() {
    var list = $('#greetings-list');
    if (!list) return;
    list.innerHTML = greetings.map(function (g, i) {
      return '<div style="display:flex;gap:6px;margin-bottom:6px"><input class="greeting-input" data-idx="' + i + '" value="' + esc(g) + '" style="flex:1;background:rgba(var(--bg-2-rgb),var(--ctrl-alpha));border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text-1);font-size:12.5px"><button class="icon-btn danger" data-del-greeting="' + i + '" title="删除"><svg class="ic"><use href="#i-x"/></svg></button></div>';
    }).join('');
    $$('#greetings-list .greeting-input').forEach(function (inp) {
      inp.addEventListener('input', function () { greetings[parseInt(inp.getAttribute('data-idx'))] = inp.value; });
    });
    $$('#greetings-list [data-del-greeting]').forEach(function (btn) {
      btn.addEventListener('click', function () { greetings.splice(parseInt(btn.getAttribute('data-del-greeting')), 1); renderGreetings(); });
    });
  }
  function renderEditTags() {
    var box = $('#edit-tags');
    if (!box) return;
    box.innerHTML = editTags.map(function (t) {
      return '<span class="tag tag-accent">' + esc(t) + ' <svg class="ic" data-del-tag="' + esc(t) + '" style="cursor:pointer"><use href="#i-x"/></svg></span>';
    }).join('');
    $$('#edit-tags [data-del-tag]').forEach(function (ic) {
      ic.addEventListener('click', function () { editTags = editTags.filter(function (t) { return t !== ic.getAttribute('data-del-tag'); }); renderEditTags(); });
    });
  }
  $('#btn-add-greeting').addEventListener('click', function () { greetings.push(''); renderGreetings(); });
  $('#btn-add-tag').addEventListener('click', function () {
    var v = $('#edit-tag-input').value.trim();
    if (v && editTags.indexOf(v) === -1) { editTags.push(v); renderEditTags(); }
    $('#edit-tag-input').value = '';
  });
  $('#edit-tag-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#btn-add-tag').click(); }
  });

  /* ============ 世界书条目编辑 ============ */
  function openWorldEditor(id) {
    api.getWorld(id).then(function (data) {
      state.currentWorld = { id: id, data: data.data };
      renderWorldEntries();
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  }
  function renderWorldEntries() {
    var w = state.currentWorld;
    if (!w) return;
    var entries = w.data.entries || {};
    var listHtml = Object.values(entries).map(function (e, i) {
      return '<div class="wi-item" style="display:flex;align-items:center;gap:8px">' +
        '<div style="flex:1;min-width:0"><div class="wi-k">' + esc((e.key || []).join(', ')) + '</div><div class="wi-c">' + esc(e.content || '') + '</div></div>' +
        '<button class="icon-btn" data-edit-entry="' + i + '" title="编辑"><svg class="ic"><use href="#i-pencil"/></svg></button>' +
        '<button class="icon-btn danger" data-del-entry="' + i + '" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
      '</div>';
    }).join('') || '<div class="empty"><div class="empty-title">暂无条目</div></div>';
    openModal('世界书 · ' + esc(w.data.name || ''), listHtml,
      '<button class="btn" id="modal-add-entry"><svg class="ic"><use href="#i-plus"/></svg> 新增条目</button><button class="btn" onclick="closeModal()">关闭</button>');
    $$('#modal-body [data-edit-entry]').forEach(function (btn) {
      btn.addEventListener('click', function () { openEntryEditor(parseInt(btn.getAttribute('data-edit-entry'))); });
    });
    $$('#modal-body [data-del-entry]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var idx = parseInt(btn.getAttribute('data-del-entry'));
        var entriesArr = Object.values(w.data.entries || {});
        var uid = entriesArr[idx].uid;
        delete w.data.entries[String(uid)];
        saveWorld();
      });
    });
    $('#modal-add-entry').addEventListener('click', function () { openEntryEditor(-1); });
  }
  function openEntryEditor(idx) {
    var w = state.currentWorld;
    var entriesArr = Object.values(w.data.entries || {});
    var e = idx >= 0 ? entriesArr[idx] : { key: [], content: '', order: 100, constant: false };
    openModal('编辑条目',
      '<div class="field"><label class="field-label">关键词（逗号分隔）</label><input id="entry-keys" value="' + esc((e.key || []).join(', ')) + '"></div>' +
      '<div class="field"><label class="field-label">内容</label><textarea id="entry-content" style="min-height:100px">' + esc(e.content || '') + '</textarea></div>' +
      '<div class="field"><label class="field-label">插入顺序</label><input id="entry-order" type="number" value="' + (e.order ?? 100) + '"></div>' +
      '<div class="check-row"><input type="checkbox" id="entry-constant" ' + (e.constant ? 'checked' : '') + '> 常驻（无需关键词）</div>',
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modal-save-entry">保存</button>');
    $('#modal-save-entry').addEventListener('click', function () {
      var keys = $('#entry-keys').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var content = $('#entry-content').value;
      var order = parseInt($('#entry-order').value) || 100;
      var constant = $('#entry-constant').checked;
      var entries = w.data.entries || {};
      if (idx >= 0) {
        var uid = Object.values(entries)[idx].uid;
        entries[String(uid)] = { ...entries[String(uid)], key: keys, content: content, order: order, constant: constant };
      } else {
        var newUid = Math.max(0, ...Object.keys(entries).map(Number)) + 1;
        entries[String(newUid)] = { uid: newUid, key: keys, content: content, order: order, constant: constant };
      }
      saveWorld();
    });
  }
  function saveWorld() {
    var w = state.currentWorld;
    api.updateWorld(w.id, w.data).then(function () {
      closeModal();
      loadWorlds();
      toast('success', 'i-check', '世界书已保存');
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  }
  $('#btn-import-world').addEventListener('click', function () {
    openModal('导入世界书', '<div class="field"><label class="field-label">粘贴世界书 JSON</label><textarea id="import-world-json" style="min-height:150px" placeholder="{...}"></textarea></div>',
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modal-import-world">导入</button>');
    $('#modal-import-world').addEventListener('click', function () {
      try {
        var json = JSON.parse($('#import-world-json').value);
        fetch('/api/worlds/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
          body: JSON.stringify(json),
        }).then(function (res) { return res.json(); }).then(function () {
          closeModal(); loadWorlds(); toast('success', 'i-check', '世界书已导入');
        }).catch(function (e) { toast('danger', 'i-alert', e.message); });
      } catch (e) { toast('danger', 'i-alert', 'JSON 格式错误'); }
    });
  });

  /* ============ 正则编辑 ============ */
  function loadRegex() {
    api.listRegex().then(function (data) {
      state.regexScripts = data.scripts;
      renderRegex();
    }).catch(function () {});
  }
  function renderRegex() {
    var scripts = state.regexScripts;
    if (!scripts.length) {
      $('#regex-list').innerHTML = '<div class="empty"><div class="empty-icon"><svg class="ic"><use href="#i-wrench"/></svg></div><div class="empty-title">暂无正则脚本</div></div>';
      return;
    }
    $('#regex-list').innerHTML = scripts.map(function (s, i) {
      return '<div class="rx-item"><div class="rx-name">' + esc(s.scriptName || '脚本 ' + (i + 1)) + '</div>' +
        '<button class="icon-btn" data-edit-rx="' + i + '" title="编辑"><svg class="ic"><use href="#i-pencil"/></svg></button>' +
        '<button class="icon-btn danger" data-del-rx="' + i + '" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
        '<div class="' + (s.disabled ? 'rx-off' : 'rx-on') + '" data-toggle-rx="' + i + '"></div></div>';
    }).join('');
    $$('#regex-list [data-edit-rx]').forEach(function (btn) {
      btn.addEventListener('click', function () { openRegexEditor(parseInt(btn.getAttribute('data-edit-rx'))); });
    });
    $$('#regex-list [data-del-rx]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = state.regexScripts[parseInt(btn.getAttribute('data-del-rx'))];
        api.deleteRegex(s.id).then(function () { loadRegex(); toast('success', 'i-check', '已删除'); });
      });
    });
    $$('#regex-list [data-toggle-rx]').forEach(function (el) {
      el.addEventListener('click', function () {
        var s = state.regexScripts[parseInt(el.getAttribute('data-toggle-rx'))];
        s.disabled = !s.disabled;
        api.updateRegex(s.id, { disabled: s.disabled }).then(function () { loadRegex(); });
      });
    });
  }
  function openRegexEditor(idx) {
    var s = idx >= 0 ? state.regexScripts[idx] : { scriptName: '', findRegex: '', replaceString: '', trimStrings: [], placement: [1, 2], disabled: false, markdownOnly: false, promptOnly: false, runOnEdit: false, substituteRegex: 0, minDepth: null, maxDepth: null };
    openModal('正则脚本',
      '<div class="field"><label class="field-label">脚本名</label><input id="rx-name" value="' + esc(s.scriptName) + '"></div>' +
      '<div class="field"><label class="field-label">查找</label><input id="rx-find" value="' + esc(s.findRegex) + '" placeholder="/pattern/flags"></div>' +
      '<div class="field"><label class="field-label">替换为</label><textarea id="rx-replace" style="min-height:60px">' + esc(s.replaceString) + '</textarea></div>' +
      '<div class="field"><label class="field-label">作用位置</label><div style="display:flex;gap:12px;flex-wrap:wrap">' +
        '<label class="check-row"><input type="checkbox" data-rx-pos="1" ' + (s.placement.indexOf(1) >= 0 ? 'checked' : '') + '> 用户输入</label>' +
        '<label class="check-row"><input type="checkbox" data-rx-pos="2" ' + (s.placement.indexOf(2) >= 0 ? 'checked' : '') + '> AI 输出</label>' +
        '<label class="check-row"><input type="checkbox" data-rx-pos="5" ' + (s.placement.indexOf(5) >= 0 ? 'checked' : '') + '> 世界书</label>' +
      '</div></div>' +
      '<div class="check-row"><input type="checkbox" id="rx-disabled" ' + (s.disabled ? 'checked' : '') + '> 禁用</div>' +
      '<div class="check-row"><input type="checkbox" id="rx-prompt-only" ' + (s.promptOnly ? 'checked' : '') + '> 仅影响提示词</div>',
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modal-save-rx">保存</button>');
    $('#modal-save-rx').addEventListener('click', function () {
      var placement = [];
      $$('[data-rx-pos]').forEach(function (cb) { if (cb.checked) placement.push(parseInt(cb.getAttribute('data-rx-pos'))); });
      var data = {
        scriptName: $('#rx-name').value.trim() || '未命名脚本',
        findRegex: $('#rx-find').value,
        replaceString: $('#rx-replace').value,
        placement: placement.length ? placement : [1, 2],
        disabled: $('#rx-disabled').checked,
        promptOnly: $('#rx-prompt-only').checked,
      };
      var p = idx >= 0 ? api.updateRegex(state.regexScripts[idx].id, data) : api.createRegex(data);
      p.then(function () { closeModal(); loadRegex(); toast('success', 'i-check', '正则已保存'); })
        .catch(function (e) { toast('danger', 'i-alert', e.message); });
    });
  }
  $('#btn-new-regex').addEventListener('click', function () { openRegexEditor(-1); });
  $('#btn-import-regex').addEventListener('click', function () {
    openModal('导入正则', '<div class="field"><label class="field-label">粘贴正则 JSON</label><textarea id="import-regex-json" style="min-height:150px" placeholder="[{...}]"></textarea></div>',
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modal-import-rx">导入</button>');
    $('#modal-import-rx').addEventListener('click', function () {
      try {
        var json = JSON.parse($('#import-regex-json').value);
        api.importRegex(json).then(function () { closeModal(); loadRegex(); toast('success', 'i-check', '正则已导入'); })
          .catch(function (e) { toast('danger', 'i-alert', e.message); });
      } catch (e) { toast('danger', 'i-alert', 'JSON 格式错误'); }
    });
  });

  /* ============ 预设持久化 ============ */
  function loadPresets() {
    api.listPresets().then(function (data) {
      state.presets = data.presets;
      var menu = document.querySelector('#preset-select .select-menu');
      if (menu) {
        menu.innerHTML = data.presets.map(function (p) {
          return '<div class="select-option' + (p.name === data.active ? ' selected' : '') + '" data-value="' + esc(p.name) + '" role="option">' + esc(p.name) + '<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>';
        }).join('') || '<div class="select-option" data-value="ChatML · 默认">ChatML · 默认</div>';
        var value = document.querySelector('#preset-select .sel-value');
        if (data.active) value.textContent = data.active;
        // 重新绑定选项点击
        menu.querySelectorAll('.select-option').forEach(function (opt) {
          opt.addEventListener('click', function (e) {
            e.stopPropagation();
            menu.querySelectorAll('.select-option').forEach(function (o) { o.classList.remove('selected'); });
            opt.classList.add('selected');
            value.textContent = opt.getAttribute('data-value');
            document.querySelector('#preset-select').classList.remove('open');
            api.activatePreset(opt.getAttribute('data-value')).then(function () { toast('success', 'i-check', '预设已激活'); });
          });
        });
      }
    }).catch(function () {});
  }
  $('#btn-save-preset').addEventListener('click', function () {
    var name = document.querySelector('#preset-select .sel-value').textContent;
    api.savePreset({
      name: name,
      sampling: { temperature: parseFloat($('#temp').value), topP: parseFloat($('#top-p').value), topK: 40 },
      instruct: {
        input_sequence: $('#instruct-input').value,
        output_sequence: $('#instruct-output').value,
        stop_sequence: $('#instruct-stop').value,
      },
    }).then(function () { loadPresets(); toast('success', 'i-check', '预设已保存'); })
      .catch(function (e) { toast('danger', 'i-alert', e.message); });
  });
  $('#btn-del-preset').addEventListener('click', function () {
    var name = document.querySelector('#preset-select .sel-value').textContent;
    api.deletePreset(name).then(function () { loadPresets(); toast('success', 'i-check', '预设已删除'); })
      .catch(function (e) { toast('danger', 'i-alert', e.message); });
  });

  /* ============ 管理面板完整 ============ */
  $('#um-admin').addEventListener('click', function () {
    api.adminUsers().then(function (data) {
      var listHtml = data.users.map(function (u) {
        return '<div class="wi-item" style="display:flex;align-items:center;gap:8px">' +
          '<div style="flex:1;min-width:0"><div class="wi-k">' + esc(u.username) + ' <span class="tag ' + (u.role === 'admin' ? 'tag-accent' : '') + '">' + esc(u.role) + '</span></div>' +
          '<div class="wi-c">' + esc(u.display_name || '') + ' · ' + (u.enabled ? '启用' : '禁用') + '</div></div>' +
          (u.role !== 'admin' ? '<button class="icon-btn" data-promote="' + u.id + '" title="提升为管理员"><svg class="ic"><use href="#i-chevron-up"/></svg></button>' : '') +
          (u.enabled ? '<button class="icon-btn" data-disable="' + u.id + '" title="禁用"><svg class="ic"><use href="#i-x"/></svg></button>' : '<button class="icon-btn" data-enable="' + u.id + '" title="启用"><svg class="ic"><use href="#i-check"/></svg></button>') +
          '<button class="icon-btn danger" data-del-user="' + u.id + '" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
        '</div>';
      }).join('');
      openModal('管理面板 · 用户管理', listHtml,
        '<button class="btn primary" id="modal-add-user"><svg class="ic"><use href="#i-plus"/></svg> 创建用户</button><button class="btn" onclick="closeModal()">关闭</button>');
      $$('#modal-body [data-promote]').forEach(function (btn) {
        btn.addEventListener('click', function () { api.adminUpdateUser(btn.getAttribute('data-promote'), { role: 'admin' }).then(function () { $('#um-admin').click(); }); });
      });
      $$('#modal-body [data-disable]').forEach(function (btn) {
        btn.addEventListener('click', function () { api.adminUpdateUser(btn.getAttribute('data-disable'), { enabled: false }).then(function () { $('#um-admin').click(); }); });
      });
      $$('#modal-body [data-enable]').forEach(function (btn) {
        btn.addEventListener('click', function () { api.adminUpdateUser(btn.getAttribute('data-enable'), { enabled: true }).then(function () { $('#um-admin').click(); }); });
      });
      $$('#modal-body [data-del-user]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!confirm('确定删除该用户吗？')) return;
          api.adminDeleteUser(btn.getAttribute('data-del-user')).then(function () { $('#um-admin').click(); });
        });
      });
      $('#modal-add-user').addEventListener('click', function () {
        openModal('创建用户',
          '<div class="field"><label class="field-label">用户名</label><input id="new-user-name"></div>' +
          '<div class="field"><label class="field-label">密码</label><input id="new-user-pass" type="password"></div>' +
          '<div class="field"><label class="field-label">显示名</label><input id="new-user-display"></div>' +
          '<div class="field"><label class="field-label">角色</label><div class="select" data-select><div class="select-trigger" tabindex="0"><span class="sel-value">user</span><span class="sel-arrow"><svg class="ic"><use href="#i-chevron-down"/></svg></span></div><div class="select-menu"><div class="select-option selected" data-value="user">user</div><div class="select-option" data-value="admin">admin</div></div></div></div>',
          '<button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="modal-create-user">创建</button>');
        $('#modal-create-user').addEventListener('click', function () {
          api.adminCreateUser({
            username: $('#new-user-name').value.trim(),
            password: $('#new-user-pass').value,
            display_name: $('#new-user-display').value.trim(),
            role: document.querySelector('#modal-body .select .sel-value').textContent,
          }).then(function () { $('#um-admin').click(); toast('success', 'i-check', '用户已创建'); })
            .catch(function (e) { toast('danger', 'i-alert', e.message); });
        });
      });
    }).catch(function (e) { toast('danger', 'i-alert', e.message); });
  });

  /* ============ 启动 ============ */
  if (isLoggedIn()) {
    api.me().then(function (data) {
      state.user = data.user;
      initApp();
    }).catch(function () { showLogin(); });
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
