<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST-Zero · 风格 H 瑞士国际主义</title>
<style>
/* ============================================================
   ST-Zero 风格 H · 瑞士国际主义
   深黑底 · 霓虹青/品红 · 故障效果 · 扫描线 · 等宽字体
   ============================================================ */
:root {
  --bg-void: #f2f2f0;
  --bg-deep: #ffffff;
  --bg-panel: rgba(255, 255, 255, 0.95);
  --ink-1: #111111;
  --ink-2: #555555;
  --ink-3: #999999;
  --cyan: #e30613;
  --magenta: #e30613;
  --cyan-dim: rgba(227, 6, 19, 0.05);
  --magenta-dim: rgba(227, 6, 19, 0.05);
  --line: #d9d9d6;
  --font-display: 'Helvetica Neue', 'Arial', 'Noto Sans SC', sans-serif;
  --font-body: 'Helvetica Neue', 'Arial', 'PingFang SC', sans-serif;
  --font-mono: 'Helvetica Neue', 'Arial', monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { font-family: var(--font-body); background: var(--bg-void); color: var(--ink-1); overflow: hidden; -webkit-font-smoothing: antialiased; }
::selection { background: rgba(0, 240, 255, 0.3); }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; flex-shrink: 0; }

/* ---------- 背景：网格 + 扫描线 + 故障 ---------- */
.bg-grid { display: none; }
.bg-scanline { display: none; }
.bg-glow { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: linear-gradient(180deg, rgba(17,17,17,0.02), transparent 30%); }
.bg-vignette { display: none; }

/* ---------- 布局 ---------- */
.app { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; }

/* 顶栏 */
.topbar { height: 56px; display: flex; align-items: center; padding: 0 24px; gap: 20px; flex-shrink: 0; border-bottom: 3px solid var(--ink-1); }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-1); }
.logo-bracket { color: var(--cyan); }
.topbar-search { position: absolute; left: 50%; transform: translateX(-50%); width: 300px; }
.topbar-search input { width: 100%; background: transparent; border: 1px solid var(--ink-1); border-radius: 0; padding: 9px 16px; color: var(--ink-1); font-size: 13px; outline: none; font-family: var(--font-body); transition: all 0.3s var(--ease-out); }
.topbar-search input:focus { border-color: var(--cyan); }
.topbar-search input::placeholder { color: var(--ink-3); }
.topbar-actions { margin-left: auto; display: flex; gap: 4px; }
.tb-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 15px; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.tb-btn:hover { color: var(--cyan); }
.tb-btn.active { color: var(--cyan); }
.avatar { width: 30px; height: 30px; border-radius: 0; background: var(--cyan); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.3s var(--ease-out); }
.avatar:hover { background: #b00510; }

/* 主体 */
.body { flex: 1; display: flex; min-height: 0; }

/* 左侧栏 */
.sidebar { width: 250px; background: var(--bg-deep); border-right: 2px solid var(--ink-1); display: flex; flex-direction: column; min-height: 0; }
.sidebar-label { padding: 20px 20px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); font-family: var(--font-display); }
.sidebar-label::before { content: ''; }
.sidebar-header { padding: 8px 14px 14px; display: flex; gap: 6px; }
.sb-btn { flex: 1; height: 36px; border: 1px solid var(--ink-1); border-radius: 0; background: transparent; color: var(--ink-1); font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-body); transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.sb-btn:hover { background: var(--ink-1); color: #fff; }
.sb-btn.primary { background: var(--cyan); border: none; color: #fff; font-weight: 700; border-radius: 0; }
.sb-btn.primary:hover { background: #b00510; }
.sidebar-tools { padding: 0 14px 14px; display: flex; gap: 6px; align-items: center; }
.sidebar-tools input { flex: 1; background: transparent; border: 1px solid var(--ink-1); border-radius: 0; padding: 7px 12px; color: var(--ink-1); font-size: 12px; outline: none; font-family: var(--font-body); }
.sidebar-tools input:focus { border-color: var(--cyan); }
.char-list { flex: 1; overflow-y: auto; padding: 0 10px 14px; }
.char-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; border-left: 4px solid transparent; transition: all 0.3s var(--ease-out); }
.char-item:hover { background: var(--cyan-dim); }
.char-item.active { border-left-color: var(--cyan); background: var(--cyan-dim); }
.char-num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); width: 22px; }
.char-item.active .char-num { color: var(--cyan); }
.char-info { flex: 1; min-width: 0; }
.char-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
.char-item.active .char-name { color: var(--cyan); }
.char-desc { font-size: 10px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.char-fav { color: var(--cyan); font-size: 11px; display: flex; }

/* 聊天区 */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header { height: 48px; display: flex; align-items: center; padding: 0 24px; gap: 12px; flex-shrink: 0; border-bottom: 2px solid var(--ink-1); }
.chat-header .ch-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-1); }
.chat-header .ch-sub { font-size: 11px; color: var(--ink-3); font-family: var(--font-body); }
.chat-header .spacer { flex: 1; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px 0; }
.chat-inner { width: 100%; max-width: 700px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; gap: 12px; max-width: 85%; animation: msg-in 0.4s var(--ease-out); }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
@keyframes msg-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.msg-avatar { width: 30px; height: 30px; border-radius: 0; background: var(--cyan-dim); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--ink-1); flex-shrink: 0; }
.msg.user .msg-avatar { background: var(--ink-1); color: #fff; }
.msg-body { min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 10px; font-size: 10px; color: var(--ink-3); margin-bottom: 6px; font-family: var(--font-body); }
.msg-meta .m-name { color: var(--cyan); font-weight: 700; }
.msg.user .msg-meta .m-name { color: var(--ink-1); font-weight: 700; }
.msg-bubble { border-left: none; background: var(--bg-deep); border: 1px solid var(--line); border-radius: 0; padding: 12px 16px; font-size: 13.5px; line-height: 1.8; color: var(--ink-1); font-family: var(--font-body); }
.msg.user .msg-bubble { border-right: none; background: var(--cyan-dim); border: 1px solid var(--cyan); border-radius: 0; padding: 12px 16px; text-align: left; }
.msg-actions { display: none; gap: 4px; margin-top: 6px; }
.msg:hover .msg-actions { display: flex; }
.msg-act { width: 22px; height: 22px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.msg-act:hover { color: var(--cyan); }
.swipe-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.swipe-btn { width: 26px; height: 26px; border-radius: 0; border: 1px solid var(--ink-1); background: transparent; color: var(--ink-1); cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.swipe-btn:hover { background: var(--ink-1); color: #fff; }
.swipe-count { font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); }
.typing { display: inline-flex; gap: 5px; padding: 8px 0; }
.typing span { width: 6px; height: 6px; border-radius: 0; background: var(--cyan); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

/* 输入栏 */
.chat-input { padding: 14px 0 20px; flex-shrink: 0; }
.input-shell { width: 100%; max-width: 700px; margin: 0 auto; padding: 0 24px; }
.input-row { display: flex; align-items: center; gap: 10px; border: 2px solid var(--ink-1); background: var(--bg-deep); border-radius: 0; padding: 4px 6px 4px 16px; transition: all 0.3s var(--ease-out); }
.input-row:focus-within { border-color: var(--cyan); }
.input-row textarea { flex: 1; background: transparent; border: none; outline: none; color: var(--ink-1); font-size: 13px; resize: none; min-height: 34px; max-height: 90px; padding: 8px 0; font-family: var(--font-body); }
.input-row textarea::placeholder { color: var(--ink-3); }
.send-btn { width: 40px; height: 40px; border: none; border-radius: 0; background: var(--cyan); color: #fff; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.send-btn:hover { background: #b00510; }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.input-tools { display: flex; gap: 2px; margin-bottom: 6px; }
.it-btn { width: 26px; height: 26px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.it-btn:hover { color: var(--cyan); }

/* 右侧栏 */
.right-panel { width: 290px; background: var(--bg-deep); border-left: 2px solid var(--ink-1); display: flex; flex-direction: column; min-height: 0; }
.rp-tabs { display: flex; border-bottom: 1px solid var(--line); }
.rp-tab { flex: 1; height: 44px; border: none; background: transparent; color: var(--ink-3); font-size: 10px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; font-family: var(--font-display); transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.rp-tab:hover { color: var(--ink-1); }
.rp-tab.active { color: var(--cyan); box-shadow: inset 0 -3px 0 var(--cyan); }
.rp-body { flex: 1; overflow-y: auto; padding: 18px; }
.rp-panel { display: none; }
.rp-panel.active { display: block; animation: fade-in 0.3s var(--ease-out); }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.field { margin-bottom: 16px; }
.field-label { display: block; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; font-family: var(--font-mono); }
.field-label::before { content: ''; }
.field input, .field textarea, .field select { width: 100%; background: transparent; border: 1px solid var(--ink-1); border-radius: 0; padding: 9px 12px; color: var(--ink-1); font-size: 13px; outline: none; font-family: var(--font-body); transition: all 0.3s var(--ease-out); }
.field textarea { resize: vertical; min-height: 46px; }
.field input:focus, .field textarea:focus { border-color: var(--cyan); }
.section-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-1); margin: 20px 0 10px; display: flex; align-items: center; gap: 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.btn { height: 34px; padding: 0 18px; border: 1px solid var(--ink-1); border-radius: 0; background: transparent; color: var(--ink-1); font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-body); transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.btn:hover { background: var(--ink-1); color: #fff; }
.btn.primary { background: var(--cyan); border: none; color: #fff; font-weight: 700; border-radius: 0; }
.btn.primary:hover { background: #b00510; }
.btn-row { display: flex; gap: 6px; margin-top: 8px; }
.icon-btn { width: 28px; height: 28px; border: none; background: transparent; color: var(--ink-3); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s var(--ease-out); appearance: none; -webkit-appearance: none; }
.icon-btn:hover { color: var(--cyan); }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); padding: 4px 0; cursor: pointer; }
.check-row input { accent-color: var(--cyan); }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--cyan); }
.slider-row input[type=number] { width: 58px; background: transparent; border: 1px solid var(--line); padding: 4px 6px; color: var(--ink-1); font-size: 11px; font-family: var(--font-mono); }
.wi-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: 0; cursor: pointer; transition: all 0.3s var(--ease-out); margin-bottom: 6px; }
.wi-item:hover { border-color: var(--cyan); background: var(--cyan-dim); }
.wi-item .wi-k { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--cyan); }
.wi-item .wi-c { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
.rx-item { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 0; margin-bottom: 6px; }
.rx-item .rx-name { flex: 1; font-family: var(--font-mono); font-size: 12px; }
.rx-on { width: 36px; height: 20px; border-radius: 0; background: var(--cyan); position: relative; cursor: pointer; }
.rx-on::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 0; background: #fff; }
.rx-off { width: 36px; height: 20px; border-radius: 0; background: var(--line); position: relative; cursor: pointer; }
.rx-off::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 0; background: var(--ink-3); }

/* 弹窗 */
.modal-overlay { position: fixed; inset: 0; background: rgba(5,5,8,0.8); backdrop-filter: blur(8px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease-out); }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal { width: 420px; max-width: calc(100vw - 32px); background: var(--bg-deep); border: 2px solid var(--ink-1); border-radius: 0; box-shadow: 8px 8px 0 rgba(17,17,17,0.15); transform: translateY(12px); transition: transform 0.3s var(--ease-out); }
.modal-overlay.show .modal { transform: translateY(0); }
.modal-header { display: flex; align-items: center; padding: 18px 22px; border-bottom: 2px solid var(--ink-1); font-family: var(--font-display); font-size: 15px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-1); }
.modal-header .spacer { flex: 1; }
.modal-body { padding: 22px; max-height: 60vh; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 6px; padding: 14px 22px; border-top: 1px solid var(--line); }

/* Toast */
.toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; min-width: 220px; padding: 12px 16px; background: var(--ink-1); color: #fff; border-radius: 0; font-size: 12px; animation: toast-in 0.3s var(--ease-out); }
.toast .ic { color: #fff; }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* 空状态 */
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 50px 20px; text-align: center; }
.empty-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-2); }
.empty-title::before { content: ''; }
.empty-line { width: 40px; height: 3px; background: var(--cyan); }
.empty-desc { font-size: 12px; color: var(--ink-3); font-family: var(--font-body); }
</style>
</head>

<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="bg-scanline"></div>
<div class="bg-vignette"></div>

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  /* ============ 数据 ============ */
  var characters = [
    { id: 1, name: '樱井千夏', desc: '温柔的高中图书委员', fav: true, replies: ['嗯！那就说定了。明天下午三点，老位置见。', '好啊，不过明天下午我要先整理新到的书。', '明天吗……抱歉，我要去参加读书会。'] },
    { id: 2, name: '艾尔文·灰烬', desc: '流亡的骑士团长', fav: false, replies: ['剑已出鞘，就没有回头的余地。', '王都的阴影比你想的更深。', '哼，勇气可嘉。'] },
    { id: 3, name: 'NOVA-7', desc: '空间站 AI 助手', fav: true, replies: ['收到。你的咖啡因摄入量超标了。', '任务已记录。你该去睡一觉。', '已执行。别谢我。'] },
    { id: 4, name: '白狐·玉藻', desc: '修行千年的狐仙', fav: false, replies: ['呵呵，凡人倒是胆大。', '千年修行，见过太多人心。', '想学仙法？先陪本仙下完棋。'] },
    { id: 5, name: '面具小丑', desc: '马戏团的谜之小丑', fav: false, replies: ['嘻嘻……你找到我了。', '面具之下是什么？你猜猜看。', '午夜的马戏团，只招待特别的客人。'] }
  ];
  var currentChar = characters[0];
  var messages = [];
  var isGenerating = false;

  /* ============ 工具 ============ */
  function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function now() { var d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function toast(msg) {
    var t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<svg class="ic"><use href="#i-check"/></svg><span>' + esc(msg) + '</span>';
    $('#toast-wrap').appendChild(t);
    setTimeout(function () { t.style.transition = 'all 0.3s ease'; t.style.opacity = '0'; t.style.transform = 'translateX(20px)'; setTimeout(function () { t.remove(); }, 300); }, 2500);
  }

  /* ============ 角色列表 ============ */
  function renderChars() {
    $('#char-list').innerHTML = characters.map(function (c, i) {
      return '<div class="char-item' + (c.id === currentChar.id ? ' active' : '') + '" data-id="' + c.id + '">' +
        '<div class="char-num">' + String(i + 1).padStart(2, '0') + '</div>' +
        '<div class="char-info"><div class="char-name">' + esc(c.name) + '</div><div class="char-desc">' + esc(c.desc) + '</div></div>' +
        (c.fav ? '<div class="char-fav"><svg class="ic ic-fill"><use href="#i-star"/></svg></div>' : '') +
      '</div>';
    }).join('');
    $$('#char-list .char-item').forEach(function (el) {
      el.addEventListener('click', function () { switchChar(parseInt(el.getAttribute('data-id'))); });
    });
  }

  /* ============ 切换角色 ============ */
  function switchChar(id) {
    currentChar = characters.find(function (c) { return c.id === id; });
    messages = [];
    $('#chat-char-name').textContent = currentChar.name;
    $('#chat-title').textContent = '· ' + currentChar.desc;
    renderChars();
    renderMessages();
    setTimeout(function () {
      addMessage(currentChar.name, currentChar.replies[0], false);
    }, 300);
  }

  /* ============ 消息渲染 ============ */
  function renderMessages() {
    var box = $('#chat-inner');
    if (!messages.length) {
      box.innerHTML = '<div class="empty"><div class="empty-title">开始一段新的对话</div><div class="empty-line"></div><div class="empty-desc">发送第一条消息开始</div></div>';
      return;
    }
    box.innerHTML = messages.map(function (m, i) {
      var html = '<div class="msg' + (m.isUser ? ' user' : '') + '" data-idx="' + i + '">' +
        '<div class="msg-avatar">' + (m.isUser ? 'S' : currentChar.name[0]) + '</div>' +
        '<div class="msg-body">' +
          '<div class="msg-meta"><span class="m-name">' + esc(m.name) + '</span><span>' + m.time + '</span></div>' +
          '<div class="msg-bubble">' + esc(m.text) + '</div>';
      if (!m.isUser && m.swipes && m.swipes.length > 1) {
        html += '<div class="swipe-row">' +
          '<button class="swipe-btn" data-swipe="-1"><svg class="ic"><use href="#i-chevron-left"/></svg></button>' +
          '<span class="swipe-count">' + (m.swipeIdx + 1) + '/' + m.swipes.length + '</span>' +
          '<button class="swipe-btn" data-swipe="1"><svg class="ic"><use href="#i-chevron-right"/></svg></button>' +
        '</div>';
      }
      html += '<div class="msg-actions">' +
        '<button class="msg-act" data-act="copy"><svg class="ic"><use href="#i-copy"/></svg></button>' +
        '<button class="msg-act" data-act="del"><svg class="ic"><use href="#i-trash"/></svg></button>' +
      '</div></div></div>';
      return html;
    }).join('');
    box.scrollIntoView({ block: 'end' });
    bindMsgActions();
  }
  function bindMsgActions() {
    $$('#chat-inner .swipe-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = parseInt(b.closest('.msg').getAttribute('data-idx'));
        var m = messages[idx];
        m.swipeIdx = Math.max(0, Math.min(m.swipes.length - 1, m.swipeIdx + parseInt(b.getAttribute('data-swipe'))));
        m.text = m.swipes[m.swipeIdx];
        renderMessages();
      });
    });
    $$('#chat-inner .msg-act').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = parseInt(b.closest('.msg').getAttribute('data-idx'));
        var act = b.getAttribute('data-act');
        if (act === 'del') { messages.splice(idx, 1); renderMessages(); }
        if (act === 'copy') { navigator.clipboard && navigator.clipboard.writeText(messages[idx].text); toast('已复制'); }
      });
    });
  }

  /* ============ 添加消息 ============ */
  function addMessage(name, text, isUser, swipes) {
    var m = { name: name, text: text, isUser: isUser, time: now(), swipes: swipes || null, swipeIdx: 0 };
    messages.push(m);
    renderMessages();
    return m;
  }

  /* ============ 发送 ============ */
  function send() {
    var input = $('#chat-input');
    var text = input.value.trim();
    if (!text || isGenerating) return;
    input.value = '';
    addMessage('你', text, true);
    isGenerating = true;
    $('#send-btn').disabled = true;
    var typing = document.createElement('div');
    typing.className = 'msg';
    typing.id = 'typing-msg';
    typing.innerHTML = '<div class="msg-avatar">' + currentChar.name[0] + '</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>';
    $('#chat-inner').appendChild(typing);
    typing.scrollIntoView({ block: 'end' });
    setTimeout(function () {
      typing.remove();
      var reply = currentChar.replies[Math.floor(Math.random() * currentChar.replies.length)];
      addMessage(currentChar.name, reply, false, [reply, currentChar.replies[(currentChar.replies.indexOf(reply) + 1) % currentChar.replies.length], currentChar.replies[(currentChar.replies.indexOf(reply) + 2) % currentChar.replies.length]]);
      isGenerating = false;
      $('#send-btn').disabled = false;
    }, 1000 + Math.random() * 600);
  }
  $('#send-btn').addEventListener('click', send);
  $('#chat-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ============ 右侧 tab ============ */
  $$('.rp-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $$('.rp-tab').forEach(function (t) { t.classList.remove('active'); });
      $$('.rp-panel').forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      $('#panel-' + tab.getAttribute('data-tab')).classList.add('active');
    });
  });

  /* ============ 主题切换 ============ */
  $('#theme-toggle').addEventListener('click', function () {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    var icon = $('#theme-toggle use');
    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      icon.setAttribute('href', '#i-moon');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      icon.setAttribute('href', '#i-sun');
    }
  });

  /* ============ 弹窗 ============ */
  $('#modal-close').addEventListener('click', function () { $('#modal-overlay').classList.remove('show'); });
  $('#modal-overlay').addEventListener('click', function (e) { if (e.target === $('#modal-overlay')) $('#modal-overlay').classList.remove('show'); });

  /* ============ 初始化 ============ */
  renderChars();
  switchChar(1);
})();
</script>
