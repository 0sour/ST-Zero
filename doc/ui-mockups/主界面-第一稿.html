<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST-Zero · 主界面第一稿</title>
<style>
/* ============================================================
   ST-Zero 主界面第一稿 · 风格 C 沉浸叙事
   基于组件库（组件库-风格C.html）集成
   ============================================================ */

/* ---------- 主题系统 ---------- */
:root {
  --bg-0: #141210;
  --bg-1: #1c1917;
  --bg-2: #262220;
  --bg-3: #322d2a;
  --bg-1-rgb: 28, 25, 23;
  --bg-2-rgb: 38, 34, 32;
  --bg-3-rgb: 50, 45, 42;
  --border: rgba(214, 178, 128, 0.16);
  --border-strong: rgba(214, 178, 128, 0.32);
  --text-1: #e8e0d4;
  --text-2: #b3a896;
  --text-3: #7d7263;
  --accent: #d6b280;
  --accent-2: #a88a5c;
  --accent-soft: rgba(214, 178, 128, 0.1);
  --accent-strong: rgba(214, 178, 128, 0.22);
  --danger: #e07a5f;
  --danger-soft: rgba(224, 122, 95, 0.12);
  --success: #81b29a;
  --success-soft: rgba(129, 178, 154, 0.12);
  --warning: #e0b45f;
  --warning-soft: rgba(224, 180, 95, 0.12);
  --radius: 8px;
  --radius-sm: 4px;
  --radius-lg: 12px;
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
  --font: 'Georgia', 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --font-ui: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', 'Consolas', monospace;
  --focus-ring: 0 0 0 2px var(--bg-0), 0 0 0 4px var(--accent);
  --transition: 0.15s ease;
  --bg-image-default: #141210;
  --mask-rgb: 20, 16, 12;
  --mask-alpha: 0.55;
  --bg-blur: 0px;
  --panel-alpha: 0.85;
  --ctrl-alpha: 0.75;
  --hl-alpha: 0.65;
}
[data-theme="light"] {
  --bg-0: #f5f1ea;
  --bg-1: #fdfbf7;
  --bg-2: #efe9df;
  --bg-3: #e4dccd;
  --bg-1-rgb: 253, 251, 247;
  --bg-2-rgb: 239, 233, 223;
  --bg-3-rgb: 228, 220, 205;
  --border: rgba(120, 90, 50, 0.18);
  --border-strong: rgba(120, 90, 50, 0.35);
  --text-1: #2b2419;
  --text-2: #6b5d48;
  --text-3: #a08d72;
  --accent: #a8824a;
  --accent-2: #8a6a3a;
  --accent-soft: rgba(168, 130, 74, 0.1);
  --accent-strong: rgba(168, 130, 74, 0.2);
  --danger: #c05a3e;
  --danger-soft: rgba(192, 90, 62, 0.1);
  --success: #4d8a6a;
  --success-soft: rgba(77, 138, 106, 0.1);
  --warning: #b08a30;
  --warning-soft: rgba(176, 138, 48, 0.1);
  --shadow: 0 2px 8px rgba(80, 60, 30, 0.1);
  --shadow-lg: 0 8px 32px rgba(80, 60, 30, 0.16);
}

/* ---------- 基础 ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { font-family: var(--font-ui); background: var(--bg-0); color: var(--text-1); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: var(--accent-strong); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }

.ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.125em; flex-shrink: 0; }
.ic-fill { fill: currentColor; stroke: none; }

/* ---------- 背景系统 ---------- */
.bg-layer { position: fixed; inset: 0; z-index: 0; background-image: var(--bg-image, var(--bg-image-default)); background-size: cover; background-position: center; filter: blur(var(--bg-blur)); }
.bg-mask { position: fixed; inset: 0; z-index: 1; background: rgba(var(--mask-rgb), var(--mask-alpha)); }
.page { position: relative; z-index: 2; height: 100vh; display: flex; flex-direction: column; }

/* ---------- 顶栏 ---------- */
.topbar { height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--font); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.logo-badge { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; }
.topbar-search { flex: 1; max-width: 320px; position: relative; }
.topbar-search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 13px; }
.topbar-search input { width: 100%; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px 7px 32px; color: var(--text-1); font-size: 13px; outline: none; font-family: var(--font-ui); transition: all var(--transition); }
.topbar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.topbar-actions { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.tb-btn { width: 34px; height: 34px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-3); border: 1px solid transparent; background: transparent; font-size: 15px; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 34px; }
.tb-btn:hover { background: var(--accent-soft); color: var(--accent); }
.tb-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--border); }
.avatar { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: var(--font); cursor: pointer; }

/* ---------- 主体三栏 ---------- */
.body { flex: 1; display: flex; min-height: 0; }

/* 左侧栏 */
.sidebar { width: 250px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.sidebar-header { padding: 10px 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
.sb-btn { flex: 1; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); color: var(--text-2); font-size: 12.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; font-family: var(--font-ui); transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 32px; }
.sb-btn .ic { font-size: 13px; }
.sb-btn:hover { border-color: var(--accent); color: var(--accent); }
.sb-btn.primary { background: var(--accent); border: none; color: var(--bg-0); font-weight: 600; }
.sb-btn.primary:hover { background: var(--accent-2); color: var(--bg-0); }
.sidebar-tools { padding: 8px 12px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
.sidebar-tools input { flex: 1; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; color: var(--text-1); font-size: 12.5px; outline: none; }
.sidebar-tools input:focus { border-color: var(--accent); }
.char-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.char-item { display: flex; gap: 10px; padding: 9px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; transition: all var(--transition); }
.char-item:hover { background: rgba(var(--bg-2-rgb, 38, 34, 32), var(--hl-alpha)); }
.char-item.active { background: var(--accent-soft); border-color: var(--border); }
.char-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; border: 1px solid var(--border); }
.char-info { flex: 1; min-width: 0; }
.char-name { font-size: 13px; font-weight: 600; font-family: var(--font); display: flex; align-items: center; gap: 6px; }
.char-name .fav { color: var(--accent); font-size: 12px; display: flex; }
.char-desc { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.char-meta { font-size: 10px; color: var(--text-3); margin-top: 3px; display: flex; gap: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; font-size: 10.5px; color: var(--text-2); background: rgba(var(--bg-3-rgb), var(--hl-alpha)); border: 1px solid var(--border); border-radius: 3px; white-space: nowrap; }
.tag-accent { color: var(--accent); background: var(--accent-soft); }

/* 聊天区 */
.chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; background: transparent; }
.chat-header { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid var(--border); background: rgba(var(--bg-1-rgb), var(--panel-alpha)); flex-shrink: 0; }
.chat-header .ch-name { font-weight: 600; font-size: 14.5px; font-family: var(--font); }
.chat-header .ch-sub { font-size: 11.5px; color: var(--text-3); }
.chat-header .spacer { flex: 1; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; gap: 10px; max-width: 80%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; border: 1px solid var(--border); }
.msg-body { min-width: 0; }
.msg-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-3); margin-bottom: 4px; }
.msg-meta .m-name { color: var(--accent); font-weight: 600; font-family: var(--font); font-size: 12px; }
.msg-bubble { background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 2px 8px 8px 2px; padding: 10px 14px; font-size: 13.5px; line-height: 1.7; font-family: var(--font); }
.msg.user .msg-bubble { background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border-left: 3px solid var(--text-3); border-radius: 8px 2px 2px 8px; }
.msg-actions { display: none; gap: 4px; margin-top: 4px; }
.msg:hover .msg-actions { display: flex; }
.msg-act { width: 24px; height: 24px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-1); color: var(--text-3); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 24px; }
.msg-act:hover { color: var(--accent); border-color: var(--accent); }
.swipe-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.swipe-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-1); color: var(--accent); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 26px; }
.swipe-btn:hover { border-color: var(--accent); }
.swipe-count { font-size: 11px; color: var(--text-3); font-family: var(--mono); }
.typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
@keyframes msg-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.msg { animation: msg-in .25s ease; }

/* 输入栏 */
.chat-input { border-top: 1px solid var(--border); padding: 10px 16px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); flex-shrink: 0; }
.input-tools { display: flex; gap: 4px; margin-bottom: 6px; }
.it-btn { width: 28px; height: 28px; border-radius: 4px; border: none; background: transparent; color: var(--text-3); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 28px; }
.it-btn:hover { background: var(--bg-2); color: var(--accent); }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.input-row textarea { flex: 1; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: var(--text-1); font-size: 14px; resize: none; outline: none; min-height: 42px; max-height: 120px; font-family: var(--font); transition: all var(--transition); }
.input-row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.send-btn { width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg-0); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 42px; }
.send-btn:hover { background: var(--accent-2); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }

/* 右侧栏 */
.right-panel { width: 320px; background: rgba(var(--bg-1-rgb), var(--panel-alpha)); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.rp-tabs { display: flex; border-bottom: 1px solid var(--border); }
.rp-tab { flex: 1; height: 40px; border: none; background: transparent; color: var(--text-3); font-size: 12.5px; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font); transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 40px; }
.rp-tab:hover { color: var(--text-1); }
.rp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.rp-body { flex: 1; overflow-y: auto; padding: 14px; }
.rp-panel { display: none; }
.rp-panel.active { display: block; }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
.field input, .field textarea, .field select { width: 100%; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text-1); font-size: 13px; outline: none; font-family: var(--font-ui); transition: all var(--transition); }
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.check-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); padding: 4px 0; cursor: pointer; }
.check-row input { accent-color: var(--accent); }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); }
.slider-row input[type=number] { width: 60px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; color: var(--text-1); font-size: 12px; }
.section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--accent); font-family: var(--font); letter-spacing: 1px; margin: 18px 0 10px; }
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; font-family: var(--font-ui); font-size: 12.5px; font-weight: 500; color: var(--text-1); background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); white-space: nowrap; appearance: none; -webkit-appearance: none; text-align: center; line-height: 32px; }
.btn .ic { font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg-0); font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); color: var(--bg-0); }
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.icon-btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 1px solid transparent; border-radius: var(--radius-sm); color: var(--text-2); cursor: pointer; font-size: 14px; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 32px; }
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

/* 世界书条目 */
.wi-list { display: flex; flex-direction: column; gap: 6px; }
.wi-item { padding: 9px 11px; border-radius: 6px; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); cursor: pointer; transition: all var(--transition); }
.wi-item:hover { border-color: var(--accent); }
.wi-item .wi-k { font-size: 12px; color: var(--accent); font-family: var(--mono); }
.wi-item .wi-c { font-size: 11px; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 正则条目 */
.rx-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 6px; background: rgba(var(--bg-2-rgb), var(--ctrl-alpha)); border: 1px solid var(--border); margin-bottom: 6px; }
.rx-item .rx-name { flex: 1; font-size: 12.5px; font-family: var(--font); }
.rx-on { width: 36px; height: 20px; border-radius: 10px; background: var(--accent); position: relative; cursor: pointer; transition: all var(--transition); }
.rx-on::after { content: ''; position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-0); transition: all var(--transition); }
.rx-off { width: 36px; height: 20px; border-radius: 10px; background: var(--bg-3); position: relative; cursor: pointer; }
.rx-off::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-3); }

/* 背景控制 */
.bg-presets { display: flex; gap: 6px; }
.bg-preset { width: 40px; height: 28px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; background-size: cover; background-position: center; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 28px; }
.bg-preset:hover { border-color: var(--accent); }
.bg-preset[data-bg="0"] { background: var(--bg-2); }
.bg-preset[data-bg="1"] { background: linear-gradient(135deg,#1a1a2e,#16213e,#0f3460); }
.bg-preset[data-bg="2"] { background: linear-gradient(135deg,#0f2027,#203a43,#2c5364); }
.bg-preset[data-bg="3"] { background: radial-gradient(ellipse at 20% 20%,#2d1b69,#1a1a2e 60%,#0f0f1a); }
.theme-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.theme-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 26px; }
.theme-swatch:hover { border-color: var(--accent); }
.theme-swatch.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
/* 自研下拉选择 */
.select { position: relative; }
.select-trigger {
  display: flex; align-items: center; gap: 6px;
  width: 100%; height: 26px;
  padding: 0 8px;
  font-family: var(--font-ui); font-size: 12px;
  color: var(--text-1);
  background: rgba(var(--bg-2-rgb), var(--ctrl-alpha));
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  user-select: none;
  transition: all var(--transition);
  appearance: none; -webkit-appearance: none;
  line-height: 26px;
}
.select-trigger:hover { border-color: var(--border-strong); }
.select.open .select-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.select-trigger .sel-value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.select-trigger .sel-arrow { color: var(--text-3); font-size: 11px; transition: transform var(--transition); flex-shrink: 0; display: flex; }
.select.open .sel-arrow { transform: rotate(180deg); color: var(--accent); }
.select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  min-width: 120px;
  z-index: 60;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 4px;
  max-height: 200px; overflow-y: auto;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: all 0.15s ease;
}
.select.open .select-menu { opacity: 1; transform: translateY(0); pointer-events: auto; }
.select-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  color: var(--text-2);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.select-option:hover { background: var(--bg-2); color: var(--text-1); }
.select-option.selected { background: var(--accent-soft); color: var(--accent); }
.select-option .sel-check { margin-left: auto; color: var(--accent); font-size: 12px; display: none; }
.select-option.selected .sel-check { display: flex; }
/* 排序图标菜单 */
.sort-menu { position: relative; flex-shrink: 0; }
.sort-trigger { width: 26px; height: 26px; font-size: 13px; }
.sort-pop {
  position: absolute; top: calc(100% + 4px); right: 0;
  min-width: 110px;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 4px;
  z-index: 60;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: all 0.15s ease;
}
.sort-menu.open .sort-pop { opacity: 1; transform: translateY(0); pointer-events: auto; }


/* 弹窗 / Toast */
.modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.modal-overlay.show { opacity: 1; pointer-events: auto; }
.modal { width: 420px; max-width: calc(100vw - 32px); background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; transform: translateY(12px) scale(0.98); transition: transform 0.2s ease; }
.modal-overlay.show .modal { transform: translateY(0) scale(1); }
.modal-header { display: flex; align-items: center; gap: 8px; padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 600; font-family: var(--font); }
.modal-header .spacer { flex: 1; }
.modal-body { padding: 20px; overflow-y: auto; font-size: 13.5px; color: var(--text-2); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.toast-wrap { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; min-width: 240px; max-width: 360px; padding: 12px 16px; background: var(--bg-1); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); box-shadow: var(--shadow-lg); font-size: 13px; animation: toast-in 0.25s ease; }
.toast .ic { font-size: 15px; }
.toast-success { border-left-color: var(--success); }
.toast-success .ic { color: var(--success); }
.toast-danger { border-left-color: var(--danger); }
.toast-danger .ic { color: var(--danger); }
@keyframes toast-in { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* 主题切换 */
.theme-toggle { position: fixed; bottom: 20px; right: 20px; z-index: 500; display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg-1); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg); font-size: 12px; cursor: pointer; color: var(--text-2); transition: all var(--transition); appearance: none; -webkit-appearance: none; text-align: center; line-height: 20px; }
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>

          </div>

            <label class="field-label">人格</label>
            <textarea id="edit-personality">温柔、细心、有点小腹黑。喜欢安静的环境，对推理小说有独特见解。</textarea>
          </div>

            <button class="btn">恢复默认</button>
          </div>
            </div>
          </div>

        <!-- 设置 -->
        <div class="rp-panel" id="panel-settings">
          <div class="section-title">背景</div>
          <div class="bg-presets">
            <button class="bg-preset" data-bg="0" title="默认"></button>
            <button class="bg-preset" data-bg="1" title="暮色"></button>
            <button class="bg-preset" data-bg="2" title="极光"></button>
            <button class="bg-preset" data-bg="3" title="霓虹"></button>
          </div>
          <div class="btn-row">
            <button class="btn" id="bg-upload">上传背景图</button>
            <button class="btn" id="bg-clear">清除</button>
            <input type="file" id="bg-file" accept="image/*" hidden>
          </div>
          <div class="section-title">主题色</div>
          <div class="theme-swatches">
            <button class="theme-swatch active" data-theme="0" title="深棕" style="background:#14100c"></button>
            <button class="theme-swatch" data-theme="1" title="暖褐" style="background:#23190f"></button>
            <button class="theme-swatch" data-theme="2" title="暗绿" style="background:#0c1610"></button>
            <button class="theme-swatch" data-theme="3" title="暗红" style="background:#1e0c0a"></button>
          </div>
          <div class="section-title">遮罩</div>
          <div class="field">
            <label class="field-label">模糊</label>
            <div class="slider-row">
              <input type="range" id="mask-blur" min="0" max="30" step="1" value="0">
              <input type="number" id="mask-blur-num" min="0" max="30" step="1" value="0" style="width:60px;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text-1);font-size:12px">
            </div>
          </div>
          <div class="field">
            <label class="field-label">透明度</label>
            <div class="slider-row">
              <input type="range" id="mask-opacity" min="0" max="100" step="1" value="55">
              <input type="number" id="mask-opacity-num" min="0" max="100" step="1" value="55" style="width:60px;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text-1);font-size:12px">
            </div>
          </div>
          <div class="field">
            <label class="field-label">面板不透明度</label>
            <div class="slider-row">
              <input type="range" id="panel-opacity" min="0" max="100" step="1" value="85">
              <input type="number" id="panel-opacity-num" min="0" max="100" step="1" value="85" style="width:60px;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:4px 6px;color:var(--text-1);font-size:12px">

        </div>        </div>
      </div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">新建角色</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="modal-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label">角色名称</label>
        <input id="modal-char-name" placeholder="输入角色名称…">
      </div>
      <div class="field">
        <label class="field-label">角色描述</label>
        <textarea id="modal-char-desc" placeholder="描述角色的性格、背景…" style="min-height:80px"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn primary" id="modal-ok">创建</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- 主题切换 -->
<button class="theme-toggle" id="theme-toggle">
  <svg class="ic"><use href="#i-settings"/></svg>
  <span id="theme-label">暗色主题</span>
</button>

<script>
(function () {
  /* ============ 数据 ============ */
  var characters = [
    { id: 1, name: '樱井千夏', initial: '樱', color: 'linear-gradient(135deg,#f472b6,#a78bfa)', desc: '温柔的高中图书委员，喜欢推理小说', tags: ['日常', '校园'], fav: true, tokens: '1.2k', chat: '放学后的图书馆',
      replies: [
        '嗯！那就说定了。明天下午三点，老位置见。',
        '好啊，不过明天下午我要先整理新到的书，可能要晚一点。',
        '明天吗……抱歉，明天我要去参加读书会，改到后天可以吗？'
      ] },
    { id: 2, name: '艾尔文·灰烬', initial: '艾', color: 'linear-gradient(135deg,#34d399,#22d3ee)', desc: '流亡的骑士团长，背负着王国的秘密', tags: ['奇幻', '冒险'], fav: false, tokens: '2.4k', chat: '王都的阴影',
      replies: [
        '剑已出鞘，就没有回头的余地。你确定要与我同行吗？',
        '王都的阴影比你想的更深，但既然你已决定，我自当护你周全。',
        '哼，勇气可嘉。不过记住，骑士的誓言一旦立下，便要用一生去守护。'
      ] },
    { id: 3, name: 'NOVA-7', initial: 'N', color: 'linear-gradient(135deg,#fbbf24,#f87171)', desc: '空间站 AI 助手，毒舌但可靠', tags: ['科幻'], fav: true, tokens: '890', chat: '轨道上的日常',
      replies: [
        '收到。顺便说一句，你的生命体征一切正常，就是咖啡因摄入量超标了。',
        '任务已记录。说真的，你该去睡一觉，我可不想明天处理你的过载警报。',
        '已执行。别谢我，这是职责所在——虽然你确实欠我一次维护保养。'
      ] },
    { id: 4, name: '白狐·玉藻', initial: '白', color: 'linear-gradient(135deg,#818cf8,#c084fc)', desc: '修行千年的狐仙，爱捉弄人', tags: ['仙侠'], fav: false, tokens: '1.8k', chat: '山间小筑',
      replies: [
        '呵呵，凡人倒是胆大，敢来扰本仙清修。说吧，所求何事？',
        '千年修行，见过太多人心。你倒是……有趣得很。',
        '想学仙法？先陪本仙下完这盘棋再说。'
      ] },
    { id: 5, name: '面具小丑', initial: '面', color: 'linear-gradient(135deg,#f87171,#fb923c)', desc: '马戏团的谜之小丑，永远在笑', tags: ['悬疑'], fav: false, tokens: '1.5k', chat: '午夜马戏团',
      replies: [
        '嘻嘻……你找到我了。那么，准备好玩个游戏了吗？',
        '面具之下是什么？你猜猜看——猜对了有奖哦。',
        '午夜的马戏团，只招待特别的客人。你，很特别。'
      ] }
  ];

  var currentChar = characters[0];
  var messages = [];
  var isGenerating = false;
  var swipeIndex = 0;

  /* ============ 工具 ============ */
  function $(sel) { return document.querySelector(sel); }
  function $$(sel) { return document.querySelectorAll(sel); }
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function now() { var d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function toast(type, icon, msg) {
    var t = document.createElement('div');
    t.className = 'toast toast-' + type;
    t.innerHTML = '<svg class="ic"><use href="#' + icon + '"/></svg><span>' + msg + '</span>';
    $('#toast-wrap').appendChild(t);
    setTimeout(function () { t.style.transition = 'all .3s ease'; t.style.opacity = '0'; t.style.transform = 'translateX(24px)'; setTimeout(function () { t.remove(); }, 300); }, 2500);
  }

  /* ============ 角色列表渲染 ============ */
  function renderChars() {
    var q = $('#char-search').value.trim().toLowerCase();
    var sort = document.querySelector('.sort-pop .select-option.selected').getAttribute('data-value');
    var list = characters.filter(function (c) { return !q || c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q); });
    if (sort === 'A-Z') list.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
    if (sort === '收藏') list.sort(function (a, b) { return (b.fav ? 1 : 0) - (a.fav ? 1 : 0); });
    $('#char-list').innerHTML = list.map(function (c) {
      return '<div class="char-item' + (c.id === currentChar.id ? ' active' : '') + '" data-id="' + c.id + '">' +
        '<div class="char-avatar" style="background:' + c.color + '">' + c.initial + '</div>' +
        '<div class="char-info">' +
          '<div class="char-name">' + esc(c.name) + (c.fav ? ' <span class="fav"><svg class="ic ic-fill"><use href="#i-star"/></svg></span>' : '') + '</div>' +
          '<div class="char-desc">' + esc(c.desc) + '</div>' +
          '<div class="char-meta">' + c.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + ' ' + c.tokens + ' tokens</div>' +
        '</div></div>';
    }).join('');
    $$('#char-list .char-item').forEach(function (el) {
      el.addEventListener('click', function () { switchChar(parseInt(el.getAttribute('data-id'))); });
    });
  }

  /* ============ 切换角色 ============ */
  function switchChar(id) {
    currentChar = characters.find(function (c) { return c.id === id; });
    messages = [];
    swipeIndex = 0;
    $('#chat-char-name').textContent = currentChar.name;
    $('#chat-title').textContent = '· ' + currentChar.chat;
    $('#edit-name').value = currentChar.name;
    $('#edit-desc').value = currentChar.desc;
    renderChars();
    renderMessages();
    // 角色开场白
    setTimeout(function () {
      addMessage(currentChar.name, currentChar.initial, currentChar.color, '（' + currentChar.chat + '）' + currentChar.replies[0], false);
    }, 300);
  }

  /* ============ 消息渲染 ============ */
  function renderMessages() {
    var box = $('#chat-messages');
    box.innerHTML = messages.map(function (m, i) {
      var html = '<div class="msg' + (m.isUser ? ' user' : '') + '" data-idx="' + i + '">' +
        '<div class="msg-avatar" style="background:' + m.color + '">' + m.initial + '</div>' +
        '<div class="msg-body">' +
          '<div class="msg-meta"><span class="m-name">' + esc(m.name) + '</span><span>' + m.time + '</span>' + (m.tokens ? '<span>' + m.tokens + 't</span>' : '') + '</div>' +
          '<div class="msg-bubble">' + esc(m.text) + '</div>';
      if (!m.isUser && m.swipes && m.swipes.length > 1) {
        html += '<div class="swipe-row">' +
          '<button class="swipe-btn" data-swipe="-1" title="上一个"><svg class="ic"><use href="#i-chevron-left"/></svg></button>' +
          '<span class="swipe-count">' + (m.swipeIdx + 1) + '/' + m.swipes.length + '</span>' +
          '<button class="swipe-btn" data-swipe="1" title="下一个"><svg class="ic"><use href="#i-chevron-right"/></svg></button>' +
        '</div>';
      }
      html += '<div class="msg-actions">' +
        '<button class="msg-act" data-act="edit" title="编辑"><svg class="ic"><use href="#i-pencil"/></svg></button>' +
        '<button class="msg-act" data-act="copy" title="复制"><svg class="ic"><use href="#i-copy"/></svg></button>' +
        '<button class="msg-act" data-act="del" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>' +
      '</div></div></div>';
      return html;
    }).join('');
    box.scrollTop = box.scrollHeight;
    bindMsgActions();
  }

  function bindMsgActions() {
    $$('#chat-messages .swipe-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = parseInt(b.closest('.msg').getAttribute('data-idx'));
        var m = messages[idx];
        m.swipeIdx = Math.max(0, Math.min(m.swipes.length - 1, m.swipeIdx + parseInt(b.getAttribute('data-swipe'))));
        m.text = m.swipes[m.swipeIdx];
        renderMessages();
      });
    });
    $$('#chat-messages .msg-act').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = parseInt(b.closest('.msg').getAttribute('data-idx'));
        var act = b.getAttribute('data-act');
        if (act === 'del') { messages.splice(idx, 1); renderMessages(); }
        if (act === 'copy') { navigator.clipboard && navigator.clipboard.writeText(messages[idx].text); toast('success', 'i-check', '已复制'); }
        if (act === 'edit') {
          var m = messages[idx];
          var newText = prompt('编辑消息：', m.text);
          if (newText !== null) { m.text = newText; renderMessages(); }
        }
      });
    });
  }

  /* ============ 添加消息 ============ */
  function addMessage(name, initial, color, text, isUser, swipes) {
    var m = { name: name, initial: initial, color: color, text: text, isUser: isUser, time: now(), tokens: Math.max(10, Math.round(text.length * 0.6)), swipes: swipes || null, swipeIdx: 0 };
    messages.push(m);
    renderMessages();
    return m;
  }

  /* ============ 发送 / 模拟回复 ============ */
  function send() {
    var input = $('#chat-input');
    var text = input.value.trim();
    if (!text || isGenerating) return;
    input.value = '';
    addMessage('你', 'S', 'linear-gradient(135deg,#d6b280,#a88a5c)', text, true);
    isGenerating = true;
    $('#send-btn').disabled = true;
    // 打字指示
    var typing = document.createElement('div');
    typing.className = 'msg';
    typing.id = 'typing-msg';
    typing.innerHTML = '<div class="msg-avatar" style="background:' + currentChar.color + '">' + currentChar.initial + '</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div>';
    $('#chat-messages').appendChild(typing);
    $('#chat-messages').scrollTop = $('#chat-messages').scrollHeight;
    // 模拟流式回复
    setTimeout(function () {
      typing.remove();
      var reply = currentChar.replies[Math.floor(Math.random() * currentChar.replies.length)];
      addMessage(currentChar.name, currentChar.initial, currentChar.color, reply, false, [reply, currentChar.replies[(currentChar.replies.indexOf(reply) + 1) % currentChar.replies.length], currentChar.replies[(currentChar.replies.indexOf(reply) + 2) % currentChar.replies.length]]);
      isGenerating = false;
      $('#send-btn').disabled = false;
    }, 1200 + Math.random() * 800);
  }

  /* ============ 右侧 tab ============ */
  $$('.rp-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      $$('.rp-tab').forEach(function (t) { t.classList.remove('active'); });
      $$('.rp-panel').forEach(function (p) { p.classList.remove('active'); });
      tab.classList.add('active');
      $('#panel-' + tab.getAttribute('data-tab')).classList.add('active');
    });
  });

  /* 顶栏设置按钮 → 设置 tab */
  $('#btn-settings').addEventListener('click', function () {
    $$('.rp-tab').forEach(function (t) { t.classList.remove('active'); });
    $$('.rp-panel').forEach(function (p) { p.classList.remove('active'); });
    document.querySelector('.rp-tab[data-tab="settings"]').classList.add('active');
    $('#panel-settings').classList.add('active');
  });

  /* ============ 正则开关 ============ */
  $$('[data-toggle]').forEach(function (t) {
    t.addEventListener('click', function () {
      t.classList.toggle('rx-on');
      t.classList.toggle('rx-off');
    });
  });

  /* ============ 背景系统 ============ */
  var presets = ['', 'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)', 'linear-gradient(135deg,#0f2027,#203a43,#2c5364)', 'radial-gradient(ellipse at 20% 20%,#2d1b69,#1a1a2e 60%,#0f0f1a)'];
  var themes = [['深棕', '20,16,12'], ['暖褐', '35,25,15'], ['暗绿', '12,22,16'], ['暗红', '30,12,10']];
  var body = document.body;
  function applyBg(v) { body.style.setProperty('--bg-image', v); }
  function applyTheme(i) {
    body.style.setProperty('--mask-rgb', themes[i][1]);
    $$('.theme-swatch').forEach(function (s, j) { s.classList.toggle('active', j === i); });
  }
  function applyBlur(v) { body.style.setProperty('--bg-blur', v + 'px'); }
  function applyOpacity(v) { body.style.setProperty('--mask-alpha', (v / 100).toFixed(2)); }
  function applyPanelOpacity(v) {
    var p = v / 100;
    body.style.setProperty('--panel-alpha', p.toFixed(2));
    body.style.setProperty('--ctrl-alpha', (p * 0.88).toFixed(2));
    body.style.setProperty('--hl-alpha', (p * 0.76).toFixed(2));
  }
  $$('.bg-preset').forEach(function (b, i) { b.addEventListener('click', function () { applyBg(presets[i]); }); });
  var file = $('#bg-file');
  $('#bg-upload').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { applyBg('url(' + r.result + ')'); };
    r.readAsDataURL(f);
  });
  $('#bg-clear').addEventListener('click', function () { applyBg(''); });
  $$('.theme-swatch').forEach(function (s, i) { s.addEventListener('click', function () { applyTheme(i); }); });
  function linkSlider(rangeId, numId, fn) {
    var r = $(rangeId), n = $(numId);
    r.addEventListener('input', function () { n.value = r.value; fn(r.value); });
    n.addEventListener('input', function () { r.value = n.value; fn(n.value); });
  }
  linkSlider('#mask-blur', '#mask-blur-num', applyBlur);
  linkSlider('#mask-opacity', '#mask-opacity-num', applyOpacity);
  linkSlider('#panel-opacity', '#panel-opacity-num', applyPanelOpacity);

  /* ============ 主题切换 ============ */
  $('#theme-toggle').addEventListener('click', function () {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) { document.documentElement.removeAttribute('data-theme'); $('#theme-label').textContent = '暗色主题'; }
    else { document.documentElement.setAttribute('data-theme', 'light'); $('#theme-label').textContent = '亮色主题'; }
  });

  /* ============ 弹窗 ============ */
  var overlay = $('#modal-overlay');
  function openModal(title) { $('#modal-title').textContent = title; overlay.classList.add('show'); }
  function closeModal() { overlay.classList.remove('show'); }
  $('#btn-new-char').addEventListener('click', function () { openModal('新建角色'); });
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-cancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  $('#modal-ok').addEventListener('click', function () {
    var name = $('#modal-char-name').value.trim();
    var desc = $('#modal-char-desc').value.trim();
    if (!name) { toast('danger', 'i-alert', '请输入角色名称'); return; }
    var id = characters.length + 1;
    characters.push({ id: id, name: name, initial: name[0], color: 'linear-gradient(135deg,#d6b280,#a88a5c)', desc: desc || '新角色', tags: ['新'], fav: false, tokens: '0', chat: '新的开始', replies: ['你好，我是' + name + '。很高兴认识你。'] });
    closeModal();
    $('#modal-char-name').value = '';
    $('#modal-char-desc').value = '';
    renderChars();
    switchChar(id);
    toast('success', 'i-check', '角色已创建');
  });

  /* ============ 导入 ============ */
  $('#btn-import-char').addEventListener('click', function () {
    toast('info', 'i-info', '导入功能开发中（支持 PNG/JSON/CharX）');
  });

  /* ============ 保存角色 ============ */
  $('#btn-save-char').addEventListener('click', function () {
    currentChar.name = $('#edit-name').value.trim() || currentChar.name;
    currentChar.desc = $('#edit-desc').value.trim();
    $('#chat-char-name').textContent = currentChar.name;
    renderChars();
    toast('success', 'i-check', '角色已保存');
  });
  $('#btn-export-char').addEventListener('click', function () {
    toast('info', 'i-info', '导出功能开发中（PNG 内嵌 JSON）');
  });

  /* ============ 发送事件 ============ */
  $('#send-btn').addEventListener('click', send);
  $('#chat-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  /* ============ 自研下拉 ============ */
  document.querySelectorAll('[data-select]').forEach(function (sel) {
    var trigger = sel.querySelector('.select-trigger');
    var options = sel.querySelectorAll('.select-option');
    var value = sel.querySelector('.sel-value');
    function open() { sel.classList.add('open'); trigger.setAttribute('aria-expanded', 'true'); }
    function close() { sel.classList.remove('open'); trigger.setAttribute('aria-expanded', 'false'); }
    function select(opt) {
      options.forEach(function (o) { o.classList.remove('selected'); });
      opt.classList.add('selected');
      value.textContent = opt.getAttribute('data-value');
      close();
      if (sel.id === 'char-sort') renderChars();
    }
    function selectSort(opt) {
      document.querySelectorAll('.sort-pop .select-option').forEach(function (o) { o.classList.remove('selected'); });
      opt.classList.add('selected');
      document.querySelector('[data-sort-menu]').classList.remove('open');
      renderChars();
    }
    trigger.addEventListener('click', function (e) {
      e.stopPropagation();
      sel.classList.contains('open') ? close() : open();
    });
    options.forEach(function (opt) {
      opt.addEventListener('click', function (e) {
        e.stopPropagation();
        select(opt);
      });
    });
    trigger.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sel.classList.contains('open') ? close() : open(); }
      if (e.key === 'Escape') close();
    });
    document.addEventListener('click', function (e) { if (!sel.contains(e.target)) close(); });
  });

  /* 排序图标菜单 */
  var sortMenu = document.querySelector('[data-sort-menu]');
  sortMenu.querySelector('.sort-trigger').addEventListener('click', function (e) {
    e.stopPropagation();
    sortMenu.classList.toggle('open');
  });
  sortMenu.querySelectorAll('.select-option').forEach(function (opt) {
    opt.addEventListener('click', function (e) {
      e.stopPropagation();
      sortMenu.querySelectorAll('.select-option').forEach(function (o) { o.classList.remove('selected'); });
      opt.classList.add('selected');
      sortMenu.classList.remove('open');
      renderChars();
    });
  });
  document.addEventListener('click', function (e) { if (!sortMenu.contains(e.target)) sortMenu.classList.remove('open'); });

  /* ============ 初始化 ============ */
  renderChars();
  switchChar(1);
})();
