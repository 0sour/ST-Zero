<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST-Zero · 从零开始的 AI 角色扮演</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>

  <symbol id="i-chevron-up" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></symbol>

<!-- ==================== 登录页 ==================== -->
<div class="login-page" id="login-page">
  <div class="login-card">
    <div class="login-logo"><div class="logo-badge">S0</div>ST-Zero</div>
    <div class="login-sub">从零开始的 AI 角色扮演</div>
    <div class="login-announcement" id="login-announcement" style="display:none"></div>
    <div class="login-error" id="login-error"></div>
    <div class="field">
      <label class="field-label">用户名</label>
      <input id="login-username" placeholder="请输入用户名" autocomplete="username">
    </div>
    <div class="field">
      <label class="field-label">密码</label>
      <input id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block btn-lg" id="login-btn">登 录</button>
  </div>
</div>

<!-- ==================== 主界面 ==================== -->
<div class="app" id="main-page" style="display:none">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="logo"><span class="logo-seal">S0</span>ST-ZERO</div>
    <div class="topbar-search">
      <input id="global-search" placeholder="搜索角色…">
    </div>
    <div class="topbar-actions">
      <button class="tb-btn" id="theme-toggle" title="切换亮暗主题"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button class="tb-btn" id="btn-settings" title="设置"><svg class="ic"><use href="#i-settings"/></svg></button>
      <div class="avatar" id="user-avatar" title="用户菜单">S</div>
    </div>
  </div>

  <div class="body">
    <!-- 左侧栏 -->
    <div class="sidebar">
      <div class="sidebar-label">Characters</div>
      <div class="sidebar-header">
        <button class="sb-btn primary" id="btn-new-char"><svg class="ic"><use href="#i-plus"/></svg> 新建</button>
        <button class="sb-btn" id="btn-import-char"><svg class="ic"><use href="#i-upload"/></svg> 导入</button>
        <button class="sb-btn" id="btn-groups" title="群聊"><svg class="ic"><use href="#i-users"/></svg></button>
        <input type="file" id="import-file" accept=".png,.json,.jsonl" hidden>
      </div>
      <div class="sidebar-tools">
        <input id="char-search" placeholder="搜索…">
        <div class="sort-menu" id="sort-menu">
          <button class="icon-btn sort-trigger" title="排序"><svg class="ic"><use href="#i-sliders"/></svg></button>
          <div class="sort-pop">
            <button class="dropdown-item selected" data-sort="recent">最近</button>
            <button class="dropdown-item" data-sort="az">A-Z</button>
            <button class="dropdown-item" data-sort="fav">收藏</button>
          </div>
        </div>
      </div>
      <div class="group-list" id="group-list"></div>
      <div class="char-list" id="char-list"></div>
    </div>

    <!-- 聊天区 -->
    <div class="chat-area">
      <div class="chat-header">
        <div class="ch-name" id="chat-char-name">—</div>
        <div class="ch-sub" id="chat-title"></div>
        <div class="spacer"></div>
        <button class="tb-btn" id="btn-chat-manage" title="聊天管理"><svg class="ic"><use href="#i-folder"/></svg></button>
        <button class="tb-btn" id="btn-chat-settings" title="聊天设置"><svg class="ic"><use href="#i-sliders"/></svg></button>
        <div class="dropdown" id="chat-more-dropdown">
          <button class="tb-btn" id="btn-chat-more" title="更多"><svg class="ic"><use href="#i-more"/></svg></button>
          <div class="dropdown-menu">
            <button class="dropdown-item" id="more-export-chat"><svg class="ic"><use href="#i-download"/></svg>导出聊天记录</button>
            <button class="dropdown-item" id="more-import-chat"><svg class="ic"><use href="#i-upload"/></svg>导入聊天记录</button>
            <div class="dropdown-sep"></div>
            <button class="dropdown-item" id="more-delete-chat"><svg class="ic"><use href="#i-trash"/></svg>删除当前聊天</button>
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages">
        <div class="chat-inner" id="chat-inner"></div>
      </div>
      <div class="chat-input">
        <div class="input-shell">
          <div class="input-tools">
            <button class="it-btn" title="附件"><svg class="ic"><use href="#i-paperclip"/></svg></button>
            <button class="it-btn" title="图片"><svg class="ic"><use href="#i-image"/></svg></button>
            <button class="it-btn" title="语音"><svg class="ic"><use href="#i-mic"/></svg></button>
            <div class="qr-wrap" id="qr-wrap">
              <button class="it-btn" id="btn-qr" title="快捷回复"><svg class="ic"><use href="#i-zap"/></svg></button>
              <div class="qr-menu" id="qr-menu"></div>
            </div>
          </div>
          <div class="input-row">
            <textarea id="chat-input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
            <button class="send-btn" id="send-btn"><svg class="ic"><use href="#i-send"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧栏 -->
    <div class="right-panel">
      <div class="rp-tabs">
        <div class="rp-tab active" data-tab="char">CHAR</div>
        <div class="rp-tab" data-tab="world">WORLD</div>
        <div class="rp-tab" data-tab="regex">REGEX</div>
        <div class="rp-tab" data-tab="preset">PRESET</div>
      </div>
      <div class="rp-body">
        <!-- 角色编辑 -->
        <div class="rp-panel active" id="panel-char">
          <div class="field"><label class="field-label">名称</label><input id="edit-name"></div>
          <div class="field"><label class="field-label">描述</label><textarea id="edit-desc"></textarea></div>
          <div class="field"><label class="field-label">人格</label><textarea id="edit-personality"></textarea></div>
          <div class="field"><label class="field-label">场景</label><textarea id="edit-scenario"></textarea></div>
          <div class="field"><label class="field-label">首条消息</label><textarea id="edit-first"></textarea></div>
          <div class="field"><label class="field-label">示例对话</label><textarea id="edit-example"></textarea></div>
          <div class="field">
            <label class="field-label">备选问候语</label>
            <div class="wi-list" id="greetings-list"></div>
            <button class="btn btn-sm" id="btn-add-greeting" style="margin-top:6px"><svg class="ic"><use href="#i-plus"/></svg> 添加问候语</button>
          </div>
          <div class="field"><label class="field-label">标签</label>
            <div class="tag-input" id="edit-tag-input">
              <div class="tag-list" id="edit-tags"></div>
              <input id="edit-tag-field" placeholder="输入标签名">
            </div>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-save-char" style="flex:1">保存</button>
            <button class="btn" id="btn-export-char" title="导出"><svg class="ic"><use href="#i-download"/></svg></button>
            <button class="btn danger" id="btn-del-char" title="删除"><svg class="ic"><use href="#i-trash"/></svg></button>
          </div>
        </div>
        <!-- 世界书 -->
        <div class="rp-panel" id="panel-world">
          <div class="btn-row" style="margin-bottom:12px">
            <button class="btn primary" id="btn-new-world" style="flex:1"><svg class="ic"><use href="#i-plus"/></svg> 新建世界书</button>
            <button class="btn" id="btn-import-world" title="导入"><svg class="ic"><use href="#i-upload"/></svg></button>
            <input type="file" id="import-world-json" accept=".json" hidden>
          </div>
          <div class="wi-list" id="world-list"></div>
        </div>
        <!-- 正则 -->
        <div class="rp-panel" id="panel-regex">
          <div class="btn-row" style="margin-bottom:12px">
            <button class="btn primary" id="btn-new-regex" style="flex:1"><svg class="ic"><use href="#i-plus"/></svg> 新建脚本</button>
            <button class="btn" id="btn-import-regex" title="导入"><svg class="ic"><use href="#i-upload"/></svg></button>
            <input type="file" id="import-regex-json" accept=".json" hidden>
          </div>
          <div class="rx-list" id="regex-list"></div>
        </div>
        <!-- 预设 -->
        <div class="rp-panel" id="panel-preset">
          <div class="field"><label class="field-label">预设</label>
            <div class="preset-select" id="preset-select">
              <span id="preset-name">默认</span><svg class="ic"><use href="#i-chevron-down"/></svg>
              <div class="preset-menu" id="preset-menu"></div>
            </div>
          </div>
          <div class="section-title">采样参数</div>
          <div class="field"><label class="field-label">Temperature</label>
            <div class="slider-row"><input type="range" id="temp" min="0" max="2" step="0.01" value="0.9"><input type="number" id="temp-num" value="0.9" step="0.01"></div>
          </div>
          <div class="field"><label class="field-label">Top P</label>
            <div class="slider-row"><input type="range" id="top-p" min="0" max="1" step="0.01" value="0.95"><input type="number" id="top-p-num" value="0.95" step="0.01"></div>
          </div>
          <div class="section-title">指令模板</div>
          <div class="field"><label class="field-label">Input</label><div class="code-box"><code id="instruct-input">&lt;|im_start|&gt;user</code></div></div>
          <div class="field"><label class="field-label">Output</label><div class="code-box"><code id="instruct-output">&lt;|im_start|&gt;assistant</code></div></div>
          <div class="field"><label class="field-label">Stop</label><div class="code-box"><code id="instruct-stop">&lt;|im_end|&gt;</code></div></div>
          <div class="btn-row">
            <button class="btn primary" id="btn-save-preset" style="flex:1">保存预设</button>
            <button class="btn danger" id="btn-del-preset" title="删除预设"><svg class="ic"><use href="#i-trash"/></svg></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 用户菜单 ==================== -->
<div class="user-menu" id="user-menu">
  <div class="um-user" id="um-user-info"></div>
  <div class="um-item" id="um-admin" style="display:none"><svg class="ic"><use href="#i-shield"/></svg>管理面板</div>
  <div class="um-divider"></div>
  <div class="um-item danger" id="um-logout"><svg class="ic"><use href="#i-logout"/></svg>退出登录</div>
</div>

<!-- ==================== 设置弹窗 ==================== -->
<div class="modal-overlay" id="settings-overlay">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span>设置</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="settings-close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body" style="display:flex;padding:0;height:480px">
      <div class="set-nav">
        <div class="set-nav-item active" data-set-tab="0">后端连接</div>
        <div class="set-nav-item" data-set-tab="1">Persona</div>
      </div>
      <div class="set-content">
        <div class="set-panel active" data-set-panel="0">
          <div class="section-title">后端连接</div>
          <div class="field">
            <label class="field-label">后端类型</label>
            <div class="select" id="backend-type">
              <div class="select-trigger" tabindex="0" role="combobox" aria-expanded="false">
                <span class="sel-value">openai</span>
                <span class="sel-arrow"><svg class="ic"><use href="#i-chevron-down"/></svg></span>
              </div>
              <div class="select-menu" role="listbox">
                <div class="select-option selected" data-value="openai" role="option">OpenAI 兼容<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
                <div class="select-option" data-value="kobold" role="option">KoboldAI<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
                <div class="select-option" data-value="text" role="option">文本补全<span class="sel-check"><svg class="ic"><use href="#i-check"/></svg></span></div>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="field-label">API 地址</label>
            <input id="backend-url" placeholder="http://localhost:11434/v1">
          </div>
          <div class="field">
            <label class="field-label">模型</label>
            <input id="backend-model" placeholder="qwen2.5">
          </div>
          <div class="field">
            <label class="field-label">API Key（可选）</label>
            <input id="backend-key" type="password" placeholder="sk-...">
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-save-settings">保存设置</button>
          </div>
        </div>
        <div class="set-panel" data-set-panel="1">
          <div class="section-title">Persona</div>
          <div class="field">
            <label class="field-label">角色名</label>
            <input id="persona-name" placeholder="你的角色名">
          </div>
          <div class="field">
            <label class="field-label">角色描述</label>
            <textarea id="persona-desc" placeholder="描述你的角色设定…"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn primary" id="btn-save-persona">保存 Persona</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
